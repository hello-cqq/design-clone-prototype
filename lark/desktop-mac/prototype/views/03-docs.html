<style>
  .dcx-col{width:250px;flex:none;background:#f7f8fa;border-right:1px solid #e5e6e8;padding:26px 12px;min-height:0;overflow:auto}
  .dcx-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13px;color:#1f2329;cursor:pointer;margin-bottom:4px}
  .dcx-item.on{background:#dce5fb;color:#3370ff;font-weight:500}
  .dcx-item svg{width:16px;height:16px;flex:none;color:currentColor;opacity:.75}
  .dcx-main{flex:1;min-width:0;overflow:auto;background:#f7f8fa;padding:26px 30px}
  .dcx-main h2{font-size:20px;font-weight:600;color:#1f2329;margin:0 0 22px}
  .dcx-banners{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:30px}

  .dcx-sec{font-size:15px;font-weight:600;color:#1f2329;margin:0 0 14px}
  .dcx-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:34px}
  .dcx-cards.four{grid-template-columns:repeat(4,1fr)}
  .dcx-card{background:#fbfbfc;border:1px solid #eef0f2;border-radius:10px;height:230px;padding:16px}
  .dcx-card b{display:block;height:16px;border-radius:6px;background:#e8eaed;width:70%;margin-bottom:12px}
  .dcx-card s{display:block;height:10px;border-radius:5px;background:#eceef0;width:74%;text-decoration:none}
  .dcx-bar{height:26px;border-radius:8px;background:#e8eaed;width:220px;margin-left:auto}
