.da-rail { width: 56px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 16px 0; background: var(--color-rail, #eef1f4); }
.da-rail .ic { width: 22px; height: 22px; color: var(--color-text-secondary, #646a73); cursor: pointer; }
.da-rail .ic.on { color: var(--color-primary, #3370ff); }
.da-side { width: 240px; flex: none; display: flex; flex-direction: column; background: var(--color-side, #f7f8fa); border-right: 1px solid var(--color-border, #dee0e3); }
.da-side .search { margin: 12px; padding: 7px 10px; border-radius: 8px; background: var(--color-bg, #ebedf0); color: var(--color-text-secondary, #646a73); font-size: 12px; }
.da-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; color: var(--color-text-primary, #1f2329); }
.da-item.on { background: var(--color-item-on, #e3ebff); border-radius: 8px; margin: 0 8px; padding: 9px 8px; }
.da-item .ic { width: 16px; height: 16px; flex: none; color: var(--color-text-secondary, #646a73); }
.da-item .lb { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.da-item .meta { font-size: 11px; color: var(--color-text-secondary, #8a9099); }
.da-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--color-surface, #fff); }
.da-head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--color-border, #e5e6e8); }
.da-head .t { font-size: 15px; font-weight: 600; flex: 1; }
.da-head .act { width: 18px; height: 18px; color: var(--color-text-secondary, #646a73); cursor: pointer; }
.da-body { flex: 1; padding: 20px 24px; overflow: hidden; }
.da-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.da-card { border: 1px solid var(--color-border, #e5e6e8); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--color-surface, #fff); cursor: pointer; }
.da-card .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.da-card .t { font-size: 13px; font-weight: 600; }
.da-card .d { font-size: 12px; color: var(--color-text-secondary, #6e7480); }
.da-bubble { max-width: 640px; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.7; }
.da-bubble.ai { background: var(--color-surface, #fff); border: 1px solid var(--color-border, #e5e6e8); }
.da-bubble.user { background: var(--color-user, #e8f3ec); margin-left: auto; }
.da-input { margin: 12px 20px 16px; border: 1px solid var(--color-border, #dee0e3); border-radius: 12px; padding: 10px 14px; color: var(--color-text-secondary, #8a9099); display: flex; align-items: center; gap: 10px; }
.da-modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.32); }
.da-modal .box { width: 460px; border-radius: 12px; background: var(--color-surface, #fff); padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.da-modal .box .t { font-size: 15px; font-weight: 600; }
.da-field { border: 1px solid var(--color-border, #dee0e3); border-radius: 8px; padding: 8px 10px; color: var(--color-text-secondary, #8a9099); }
.da-btnrow { display: flex; justify-content: flex-end; gap: 10px; }
.da-btn { border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
.da-btn.pri { background: var(--color-primary, #3370ff); color: #fff; }
.da-btn.ghost { border: 1px solid var(--color-border, #dee0e3); }

/* M44f 防裁切/空槽：标题与列表预览省略号；空主区给空态文案（layout-sanity 门要求） */
.da-head { min-width: 0; }
.da-head .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.da-item .lb, .da-conv .sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.da-empty { height: 100%; display: grid; place-items: center; color: #b6bac2; font-size: 13px; }

/* M44f sweep 修复：主区可滚动（避免内容被裁判定）；头部工具条换行不裁切 */
.da-main { overflow: auto; min-height: 0; }
.da-side { overflow-y: auto; min-height: 0; }
.da-head { flex-wrap: wrap; row-gap: 6px; }

/* M44f sweep：模态盒内容可滚动，防垂直裁切 */
.da-modal .box { overflow: auto; max-height: 86%; }

/* M44f sweep：主栏必须占满剩余宽度（否则模态/内容溢出窄主栏）；root 作为模态定位基准 */
.da-main { flex: 1; min-width: 0; }
.da-root { position: relative; }
.da-modal { inset: 0; }

/* M44f sweep：头部动作按钮可收缩省略，防工具条横向裁切 */
.da-head .act { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* M44g 视觉丰富度：彩色 icon tile / 层次卡片 / 标签 chip / 渐变 banner / 彩色面板 / 快捷指令 */
.da-tile { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex: none; display: block; }
.da-tile.lg { width: 52px; height: 52px; border-radius: 12px; }
.da-card2 { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(20,24,40,.06), 0 8px 24px rgba(20,24,40,.05); padding: 16px; }
.da-chip { display: inline-block; padding: 3px 10px; border-radius: 6px; background: #f2f3f5; color: #4b5563; font-size: 12px; }
.da-banner { border-radius: 14px; padding: 22px 26px; color: #1c2b4a; background: linear-gradient(120deg, #dfe7ff 0%, #eef2ff 45%, #e6f4ee 100%); position: relative; overflow: hidden; }
.da-banner .bt { font-size: 22px; font-weight: 700; line-height: 1.3; }
.da-banner .bs { font-size: 12px; color: #5b6b8c; margin-top: 6px; }
.da-panel { border-radius: 12px; padding: 14px 16px; color: #fff; }
.da-panel .pt { font-size: 14px; font-weight: 600; }
.da-panel .ps { font-size: 12px; opacity: .85; margin-top: 6px; line-height: 1.6; }
.da-ql { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: #fff; border: 1px solid #e5e7eb; font-size: 13px; color: #374151; cursor: pointer; }
.da-agentcard { border-radius: 12px; background: #eef4ff; padding: 16px 18px; }
.da-agentcard .at { color: #2563eb; font-size: 15px; font-weight: 600; }
.da-agentcard .as { color: #2563eb; font-size: 13px; margin-top: 6px; }

/* M46：侧栏顶部落款（头像+添加）——lark/workbuddy 等桌面壳通用 */
.da-side .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 6px; }
.da-side .ava { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
.da-side .grp { font-size: 12px; color: #8f959e; padding: 10px 22px 4px; }

</style>
</head>
<body>
<div id="dc-topbar">
  <span class="dc-logo"></span>
  <span id="dc-title">Lark·桌面全功能原型</span>
  <span id="dc-crumb"><span id="dc-cur">—</span></span>
  <span class="dc-spacer"></span>
  <div id="dc-viewmode">
    <button data-vm="preview" class="on" title="预览"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span>预览</span></button>
    <button data-vm="code" title="代码"><svg viewBox="0 0 24 24"><path d="m8 8-5 4 5 4"/><path d="m16 8 5 4-5 4"/></svg><span>代码</span></button>
  </div>
  <div id="dc-device-wrap">
    <button id="dc-device-btn" class="dc-tb" title="设备类型（覆盖 platform.json）" aria-haspopup="true" aria-expanded="false"><span id="dc-device-label">设备</span> ▾</button>
    <div id="dc-device-dd" hidden role="menu"></div>
  </div>
  <div id="dc-share-wrap">
    <button id="dc-share-btn" class="dc-ic" title="分享：状态链接 / 纯净版 / 卡片版 / 全屏演示" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v14"/></svg></button>
    <div id="dc-share-dd" hidden role="menu"></div>
  </div>
  <button id="dc-shot-btn" class="dc-ic" title="截图：导出当前页 PNG"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
  <button id="dc-compare-btn" class="dc-ic" title="对照原截图"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 3v18"/></svg></button>
  <button id="dc-theme" class="dc-ic" title="明暗主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
  <button id="dc-demo" class="dc-ic" title="演示模式 D"><svg viewBox="0 0 24 24"><path d="m6 4 14 8-14 8z"/></svg></button>
  <div id="dc-export-wrap">
    <button id="dc-export-btn" class="dc-tb primary">导出 ▾</button>
    <div id="dc-export-dd" hidden></div>
  </div>
</div>

<div id="dc-shell">
  <nav id="dc-rail">
    <button data-ia="pages" class="on" title="页面（1）">
      <svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/></svg><span>页面</span></button>
    <button data-ia="scene" title="场景（2）· 树与路径">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8 6h4a3 3 0 0 1 3 3v0M8 18h4a3 3 0 0 0 3-3v0"/></svg><span>场景</span></button>
  </nav>

  <aside id="dc-left">
    <div id="dc-left-search">
      <input id="dc-q" class="dc-inp" type="search" placeholder="筛选页面 / 场景…" aria-label="筛选页面或场景" autocomplete="off">
    </div>
    <div id="dc-left-pages">
      <div class="dc-sec">页面 PAGES</div>
      <div id="dc-pages"></div>
    </div>
    <div id="dc-left-scene" hidden>
      <div class="dc-sec">场景 SCENES</div>
      <div id="dc-tree"></div>
    </div>
    <button id="dc-left-fold" title="折叠/展开左栏">‹</button>
  </aside>

  <main id="dc-workspace">
    <div id="dc-single">
      <div id="dc-zoomwrap">
        <div id="dc-phone"><div id="dc-screen"><div id="dc-stage"></div></div></div>
      </div>
      <div id="dc-overlay"></div>
    </div>
    <div id="dc-flow" hidden>
      <div id="dc-flow-toggle">
        <button data-fm="tree" class="on">树</button><button data-fm="path">路径</button>
      </div>
      <div id="dc-flow-canvas"></div>
    </div>
    <div id="dc-code" hidden>
      <div id="dc-code-head"><b id="dc-code-title"></b><button id="dc-code-copy" class="dc-btn">复制</button><button id="dc-code-open" class="dc-btn">新标签打开</button></div>
      <pre id="dc-code-pre"></pre>
    </div>
  </main>

  <aside id="dc-right">
    <div id="dc-boardhead">详情</div>
    <div id="dc-board-detail" class="dc-board on"></div>
    <button id="dc-right-fold" title="折叠/展开右栏">›</button>
  </aside>
</div>

<div id="dc-bottombar">
  <button id="dc-read" class="on" title="阅读"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span class="lb">阅读</span></button>
  <button id="dc-edit" title="编辑 E"><svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg><span class="lb">编辑</span></button>
  <span class="bb-sep"></span>
  <button id="dc-ann-toggle" title="标注 A"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="cnt"></span><span class="lb">标注</span></button>
  <button id="dc-frame-toggle" title="设备边框（默认关）"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg><span class="lb">边框</span></button>
  <button id="dc-labels-toggle" title="按钮文字开/关"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg><span class="lb">文字</span></button>
  <span class="bb-sep"></span>
  <button id="dc-play" title="播放路径 P（页面模式=从当前页起播，场景模式=播所选路径）"><svg viewBox="0 0 24 24"><path d="m6 4 14 8-14 8z"/></svg><span class="lb">播放</span></button>
  <span class="bb-sep"></span>
  <button id="dc-undo" title="撤销 Ctrl+Z"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
  <button id="dc-restore" title="一键还原到克隆原件"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</div>

<div id="dc-zoombar">
  <button id="dc-zoom-out" title="缩小">−</button><span id="dc-zoom-pct">100%</span><button id="dc-zoom-in" title="放大">＋</button>
  <button id="dc-zoom-100" title="实际大小">1:1</button><button id="dc-zoom-fit" title="适应画布">适应</button><button id="dc-hand" title="抓手 H">抓手</button>
</div>

<div id="dc-player"></div>
<div id="dc-compare"><div id="dc-compare-head"><b>原截图对照</b><span id="dc-compare-src"></span><button id="dc-compare-x" title="关闭">✕</button></div><div id="dc-compare-body"><img src="" alt="原截图对照"></div></div>
<div id="dc-modal-root"></div>
