<style>
  .tk-col{width:250px;flex:none;background:#f7f8fa;border-right:1px solid #e5e6e8;padding:20px 12px;min-height:0;overflow:auto}
  .tk-col .hd{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#1f2329;padding:0 8px 14px}
  .tk-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;color:#1f2329;cursor:pointer;margin-bottom:2px}
  .tk-item.on{background:#dce5fb;color:#3370ff}
  .tk-item.hov{background:#e5e6e8}
  .tk-item svg{width:15px;height:15px;flex:none;opacity:.8}
  .tk-grp{font-size:12px;color:#8f959e;padding:12px 10px 4px;display:flex;align-items:center;gap:6px}
  .tk-sub{padding:6px 10px 6px 30px;font-size:13px;color:#1f2329;cursor:pointer;border-radius:8px}
  .tk-main{flex:1;min-width:0;overflow:auto;background:#fff;padding:20px 26px}
  .tk-main .hd{display:flex;align-items:center;font-size:16px;font-weight:600;color:#1f2329}
  .tk-tabs{display:flex;gap:20px;border-bottom:1px solid #e5e6e8;margin:14px 0 16px}
  .tk-tabs .tb{display:flex;gap:6px;align-items:center;font-size:13px;color:#646a73;padding:0 2px 9px;cursor:pointer}
  .tk-tabs .tb.on{color:#3370ff;font-weight:600;border-bottom:2px solid #3370ff}
  .tk-bar{display:flex;align-items:center;gap:16px;font-size:12px;color:#646a73;flex-wrap:wrap}
  .tk-bar .pill{display:flex;align-items:center;gap:6px;border:1px solid #dee0e3;border-radius:7px;padding:6px 10px;cursor:pointer;color:#1f2329;font-size:12px}
  .tk-bar .pill.blue{background:#e8f0ff;border-color:#bcd4ff;color:#3370ff}
  .tk-cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;font-size:12px;color:#646a73;padding:14px 4px 10px;align-items:center}
  .tk-cols span{display:flex;gap:6px;align-items:center}
  .tk-group{display:flex;gap:8px;align-items:center;font-size:13px;color:#1f2329;font-weight:600;padding:8px 4px}
  .tk-empty{padding:26px 40px;color:#c2c6cc;font-size:13px}
  .tk-add{display:flex;gap:8px;align-items:center;color:#8f959e;font-size:13px;padding:10px 4px;cursor:pointer}
</style>
