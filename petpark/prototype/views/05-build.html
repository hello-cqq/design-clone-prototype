<style>
  .pz{--color-bg:#eaf6d8;position:absolute;inset:0;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#4a3a1c;background:#eaf6d8}

  .pz .tray .m i{position:absolute;right:3px;bottom:3px;background:rgba(74,58,28,.72);color:#fff;border-radius:8px;font-style:normal;font-size:8.5px;padding:1px 5px}

  .pz .nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.92);border-radius:16px;padding:9px 2px 8px;display:grid;place-items:center;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(91,58,30,.14)}
