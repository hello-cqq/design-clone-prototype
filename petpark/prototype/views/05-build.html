<style>
  .pz{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#5b3a1e;background:linear-gradient(180deg,#cfe8b8,#fff6e9)}
  .pz .plot{position:absolute;left:0;right:0;bottom:0;height:62%;background:url(assets/pp-grass.png) center/cover;box-shadow:0 -12px 30px rgba(91,58,30,.18)}
  .pz .scroll{position:relative;z-index:4;padding:50px 14px 108px;box-sizing:border-box}
  .pz .top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .pz .top h1{font-size:16px;font-weight:600;margin:0;flex:1}
  .pz .top .res{background:rgba(255,255,255,.88);border-radius:999px;padding:6px 12px;font-size:10.5px;font-weight:600}
  .pz .mats{display:flex;gap:8px;margin-bottom:10px}
  .pz .mats .m{flex:1;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:14px;padding:9px 4px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 8px 18px rgba(91,58,30,.14)}
  .pz .mats .m.on{background:linear-gradient(140deg,#ffb35c,#f28c2e);color:#fff}
  .pz .hint{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px;font-size:11px;color:#8a6440;box-shadow:0 8px 18px rgba(91,58,30,.14)}
  .pz .ops{position:absolute;left:14px;right:14px;bottom:64px;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pz .ops span{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:999px;padding:11px 4px;text-align:center;font-size:11.5px;font-weight:600;color:#b0552f;cursor:pointer;box-shadow:0 10px 22px rgba(91,58,30,.18);transition:transform .16s ease}
  .pz .ops span:active{transform:scale(.93)}
  .pz .ops span.main{background:linear-gradient(140deg,#ffb35c,#f28c2e);color:#fff}
  .pz .nav{position:absolute;left:12px;right:12px;bottom:18px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.9);border-radius:16px;padding:8px 2px 7px;display:grid;place-items:center;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(91,58,30,.14)}
  .pz .nav span.on{color:#e8862f;font-weight:600}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far plot" data-fx-parallax="0.4"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="12" data-fx-colors="#ffffff,#ffe9a8"></canvas>
  <div class="scroll">
    <div class="top"><h1>我的家园</h1><span class="res">木材 32</span><span class="res">花朵 18</span></div>
    <div class="mats" data-dc="pp/mats">
      <span class="m on" data-act="radio" data-group="mat">房屋</span>
      <span class="m" data-act="radio" data-group="mat">植物</span>
      <span class="m" data-act="radio" data-group="mat">家具</span>
      <span class="m" data-act="radio" data-group="mat">装饰</span>
    </div>
    <div class="hint" data-dc="pp/hint">拖拽素材到地块放置 · 双指旋转/缩放 · 小动物会自己来玩</div>
  </div>
  <div class="ops" data-dc="pp/ops">
    <span class="main" data-dc="pp/place" data-act="toast" data-msg="放置：小木屋 ×1（演示）">放置</span>
    <span data-act="toast" data-msg="旋转 45°（演示）">旋转</span>
    <span data-act="toast" data-msg="已撤销上一步（演示）">撤销</span>
    <span data-act="toast" data-msg="家园已保存（演示）">保存</span>
  </div>
  <div class="nav" data-dc="pp/tabs"><span data-dc="pp/tab-home" data-goto="01-home">乐园</span><span data-goto="02-interact">动物</span><span data-goto="03-band">乐队</span><span class="on" data-goto="05-build">家园</span><span data-goto="07-tasks">任务</span></div>
</div>
