<style>
  .pz{--color-bg:#fff6e9;position:absolute;inset:0;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#5b3a1e;background:#fff6e9}
  .pz .far{position:absolute;inset:0;overflow:hidden}
  .pz .far::before{content:"";position:absolute;inset:-7%;background:url(assets/pp-map.png) center/cover no-repeat;opacity:.35;filter:blur(3px);animation:kb 36s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.02)}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,246,233,.9),rgba(255,246,233,.55) 40%,rgba(255,246,233,.9))}
  .pz .scroll{position:relative;z-index:4;height:100%;overflow-y:auto;padding:50px 14px 96px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
  .pz h1{font-size:17px;font-weight:600;margin:2px 2px 0}
  .pz .tk{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.94);border-radius:18px;padding:11px 12px;box-shadow:0 10px 24px rgba(91,58,30,.14)}
  .pz .tk img{width:44px;height:44px;border-radius:12px;object-fit:cover;object-position:50% 30%;box-shadow:0 6px 14px rgba(91,58,30,.18)}
  .pz .tk .tx{flex:1}
  .pz .tk .tt{font-size:12.5px;font-weight:600}
  .pz .tk .pg{margin-top:6px;height:6px;border-radius:4px;background:rgba(91,58,30,.12);overflow:hidden}
  .pz .tk .pg i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffb35c,#f28c2e)}
  .pz .tk .b{border:0;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:600;cursor:pointer;background:linear-gradient(140deg,#ffb35c,#f28c2e);color:#fff;box-shadow:0 8px 18px rgba(242,140,46,.4)}
  .pz .tk .b.done{background:rgba(91,58,30,.1);color:#a07a4f;box-shadow:none}
  .pz .act{border-radius:20px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 12px 28px rgba(91,58,30,.16)}
  .pz .act img{display:block;width:100%;height:110px;object-fit:cover}
  .pz .act .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(180deg,transparent,rgba(58,32,10,.72));color:#fff;font-size:12px;font-weight:600}
  .pz .nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.92);border-radius:16px;padding:9px 2px 8px;display:grid;place-items:center;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(91,58,30,.14)}
  .pz .nav span.on{color:#e8862f;font-weight:600}
  @media (prefers-reduced-motion: reduce){.pz .far::before{animation:none}}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far" data-fx-parallax="0.4"></div>
  <div class="veil"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="12" data-fx-colors="#ffffff,#ffd66b"></canvas>
  <div class="scroll">
    <h1>任务与活动</h1>
    <div class="tk" data-dc="pp/tasks"><img src="assets/pp-fox.png" alt=""><div class="tx"><div class="tt">和耳廓狐互动 3 次</div><div class="pg"><i style="width:66%"></i></div></div><button class="b" data-goto="02-interact">去完成</button></div>
    <div class="tk"><img src="assets/pp-stage.png" alt=""><div class="tx"><div class="tt">乐队排练 1 场</div><div class="pg"><i style="width:0%"></i></div></div><button class="b" data-goto="03-band">去排练</button></div>
    <div class="tk"><img src="assets/pp-grass.png" alt=""><div class="tx"><div class="tt">家园放置 2 件家具</div><div class="pg"><i style="width:50%"></i></div></div><button class="b" data-goto="05-build">去搭建</button></div>
    <div class="tk"><img src="assets/pp-golden.png" alt=""><div class="tx"><div class="tt">每日签到 · 已连签 6 天</div><div class="pg"><i style="width:100%"></i></div></div><button class="b done" data-act="toast" data-msg="今日已签到：+20 金币（演示）">已完成</button></div>
    <div class="act" data-act="toast" data-msg="周末活动：河岸音乐节预告（演示）"><img src="assets/pp-stage.png" alt=""><div class="cap">周末活动 · 河岸音乐节 周六开演</div></div>
  </div>
  <div class="nav" data-dc="pp/tabs"><span data-dc="pp/tab-home" data-goto="01-home">乐园</span><span data-goto="02-interact">动物</span><span data-goto="03-band">乐队</span><span data-goto="05-build">家园</span><span class="on" data-goto="07-tasks">任务</span></div>
</div>
