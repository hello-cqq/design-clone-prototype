<style>
  .pz{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#5b3a1e;background:#fff6e9}
  .pz .far{position:absolute;inset:0;background:url(assets/pp-map.png) center/cover no-repeat;animation:kb 36s ease-in-out infinite alternate}
  @keyframes kb{from{background-size:110% auto}to{background-size:102% auto}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,246,233,.15),rgba(255,246,233,.82) 78%)}
  .pz .tt{position:absolute;left:0;right:0;bottom:24%;text-align:center}
  .pz .tt h1{margin:0;font-size:36px;font-weight:600;color:#e8862f;text-shadow:0 3px 0 #fff,0 8px 22px rgba(232,134,47,.35);letter-spacing:.1em}
  .pz .tt p{margin:10px 0 0;font-size:12px;color:#8a6440;letter-spacing:.22em}
  .pz .go{position:absolute;left:50%;transform:translateX(-50%);bottom:10%;padding:14px 56px;border:0;border-radius:999px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(140deg,#ffb35c,#f28c2e);cursor:pointer;box-shadow:0 14px 30px rgba(242,140,46,.45), inset 0 2px 0 rgba(255,255,255,.55)}
  @media (prefers-reduced-motion: reduce){.pz .far{animation:none}}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far" data-fx-parallax="0.4"></div>
  <div class="veil"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="18" data-fx-colors="#ffffff,#ffd66b"></canvas>
  <div class="tt"><h1>动物乐园</h1><p>和小动物一起唱歌 · 跳舞 · 建造家园</p></div>
  <button class="go" data-dc="pp/start" data-goto="01-home">开始冒险</button>
</div>
