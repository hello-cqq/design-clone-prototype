<style>
  .pz{--color-bg:#fff6e9;position:absolute;inset:0;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#5b3a1e;background:#fff6e9}
  .pz .far{position:absolute;inset:0;overflow:hidden}
  .pz .far::before{content:"";position:absolute;inset:-7%;background:url(assets/pp-map.png) center/cover no-repeat;animation:drift 30s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.12) translate(-2%,-2%)}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,246,233,.8),transparent 26%,transparent 52%,rgba(255,246,233,.92) 84%)}
  .pz .bub{position:absolute;z-index:5;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-size:10.5px;font-weight:600;color:#b0552f;box-shadow:0 8px 18px rgba(91,58,30,.18);cursor:pointer}
  .pz .guide{position:absolute;left:14px;right:14px;bottom:86px;z-index:6;background:rgba(255,255,255,.94);border-radius:20px;padding:12px 14px;box-shadow:0 14px 32px rgba(91,58,30,.2)}
  .pz .guide .hd{display:flex;align-items:center;gap:10px}
  .pz .guide .hd img{width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:0 6px 14px rgba(91,58,30,.2)}
  .pz .guide .hd .nm{font-size:13px;font-weight:600;flex:1}
  .pz .guide .row{display:flex;gap:8px;margin-top:10px}
  .pz .guide .row .b{flex:1;border:0;border-radius:999px;padding:9px 4px;font-size:11px;font-weight:600;cursor:pointer;background:rgba(255,179,92,.18);color:#b0552f}
  .pz .guide .row .b.pri{background:linear-gradient(140deg,#ffb35c,#f28c2e);color:#fff;box-shadow:0 8px 18px rgba(242,140,46,.4)}
  .pz .nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.92);border-radius:16px;padding:9px 2px 8px;display:grid;place-items:center;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(91,58,30,.14)}
  .pz .nav span.on{color:#e8862f;font-weight:600}
  @media (prefers-reduced-motion: reduce){.pz .far::before{animation:none}}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far" data-fx-parallax="0.5"></div>
  <div class="veil"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="12" data-fx-colors="#ffffff,#ffd66b"></canvas>
  <span class="bub" style="left:14%;top:24%" data-act="toast" data-msg="中央广场：喷泉电车每 5 分钟一班（演示）">中央广场</span>
  <span class="bub" style="right:12%;top:32%" data-act="toast" data-msg="音乐剧场：今晚 19:30 星光场（演示）">音乐剧场</span>
  <span class="bub" style="left:20%;top:46%" data-act="toast" data-msg="森林车站：领今日体力（演示）">森林车站</span>
  <span class="bub" style="right:16%;top:56%" data-act="toast" data-msg="河岸咖啡街：喂食冻干购买点（演示）">河岸咖啡街</span>
  <div class="guide" data-dc="pp/guide">
    <div class="hd"><img src="assets/pp-fox.png" alt=""><span class="nm">向导 · 耳廓狐</span><span style="font-size:10px;color:#a07a4f">已带路 12 次</span></div>
    <div class="row"><button class="b pri" data-act="toast" data-msg="路线已规划：广场→剧场→咖啡街（演示）">地图</button><button class="b" data-act="toast" data-msg="已收藏 3 个地点（演示）">收藏</button><button class="b" data-goto="07-tasks">任务</button></div>
  </div>
  <div class="nav" data-dc="pp/tabs"><span data-dc="pp/tab-home" data-goto="01-home">乐园</span><span data-goto="02-interact">动物</span><span data-goto="03-band">乐队</span><span data-goto="05-build">家园</span><span data-goto="07-tasks">任务</span></div>
</div>
