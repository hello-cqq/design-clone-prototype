<style>
  .ppx{position:relative;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#24402e;background:#dcefd8}
  .ppx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .ppx .L-far{background:url(assets/pp-bg.png) center/cover no-repeat;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .ppx .scroll{position:relative;z-index:4;padding:52px 16px 108px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 14px 34px rgba(36,64,46,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .ppx-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ppx-head .t{font-size:17px;font-weight:600}
  .ppx-head .sp{flex:1}
  .ppx-head .add{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#8fe0a8,#3fb873);cursor:pointer;box-shadow:0 6px 14px rgba(63,184,115,.4), inset 0 1px 0 rgba(255,255,255,.6)}
  .ppx-card{position:relative;border-radius:24px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 40px rgba(36,64,46,.22)}
  .ppx-card img{display:block;width:100%;height:220px;object-fit:cover;object-position:50% 40%;animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}
  .ppx-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(20,44,28,.4));pointer-events:none}
  .ppx-card .nm{position:absolute;left:16px;bottom:12px;color:#fff;font-size:18px;font-weight:600;text-shadow:0 2px 8px rgba(10,30,16,.6);cursor:pointer}
  .ppx-card .tag{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.82);color:#20603c;font-size:10.5px;font-weight:600;border-radius:999px;padding:5px 11px}
  .ppx-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .ppx-ring{padding:12px 6px;text-align:center;cursor:pointer}
  .ppx-ring .dial{position:relative;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v) * 1%),rgba(36,64,46,.12) 0);display:grid;place-items:center}
  .ppx-ring .dial::before{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,.85)}
  .ppx-ring .dial b{position:relative;font-size:13px;font-weight:600;color:var(--c)}
  .ppx-ring .lb{font-size:11px;font-weight:600}
  .ppx-rows{padding:6px 16px;margin-bottom:12px}
  .ppx-r{display:flex;align-items:center;gap:10px;padding:12px 2px;font-size:12.5px;font-weight:600;border-bottom:1px solid rgba(36,64,46,.08);cursor:pointer}
  .ppx-r:last-child{border-bottom:0}
  .ppx-r .ic{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.78);box-shadow:0 3px 8px rgba(36,64,46,.12)}
  .ppx-r .sp{flex:1}
  .ppx-r .ar{opacity:.45}
  .ppx-minis{display:flex;gap:10px}
  .ppx-mini{flex:1;display:flex;gap:8px;align-items:center;padding:10px;cursor:pointer}
  .ppx-mini img{width:38px;height:38px;border-radius:12px;object-fit:cover}
  .ppx-mini .n{font-size:11.5px;font-weight:600}
  .ppx-mini .s{font-size:9.5px;color:#54705c}
  .ppx-tabs{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .ppx-tabs span{font-size:12px;color:#54705c;cursor:pointer;padding:6px 13px;border-radius:999px}
  .ppx-tabs span.on{background:linear-gradient(140deg,#8fe0a8,#3fb873);color:#0d3a20;font-weight:600;box-shadow:0 6px 14px rgba(63,184,115,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.ppx .L-far,.ppx-card img{animation:none}}
</style>
<div data-dc="pp/root" class="ppx">
  <div class="L L-far" data-fx-parallax="0.4"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="14" data-fx-colors="#ffffff,#ffe9a8"></canvas>
  <div class="scroll">
    <div class="ppx-head" data-dc="pp/head">
      <span class="t">萌宠档案</span><span class="sp"></span>
      <span class="add" data-act="dialog" data-title="新增档案" data-body="为新的毛孩子建立乐园档案？（演示）"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg></span>
    </div>
    <div class="ppx-card" data-dc="pp/petcard" data-fx-parallax="1.2">
      <img src="assets/pp-home.png" alt="" data-act="toast" data-msg="旺财蹭了蹭你的手（演示）">
      <span class="nm" data-act="toast" data-msg="旺财：柯基 · 2 岁 · 已绝育（演示）">旺财 · 柯基 · 2 岁</span><span class="tag">已绝育 · 芯片已登记</span>
    </div>
    <div class="ppx-rings" data-dc="pp/rings">
      <div class="ppx-ring glass" style="--c:#3fb873;--v:80" data-act="toast" data-msg="体力 80：今天还能跑 5 圈（演示）"><span class="dial"><b>80</b></span><div class="lb">体力</div></div>
      <div class="ppx-ring glass" style="--c:#e8a53c;--v:92" data-act="toast" data-msg="心情 92：刚吃了冻干（演示）"><span class="dial"><b>92</b></span><div class="lb">心情</div></div>
      <div class="ppx-ring glass" style="--c:#5a8fd8;--v:65" data-act="toast" data-msg="社交 65：认识了 3 个新朋友（演示）"><span class="dial"><b>65</b></span><div class="lb">社交</div></div>
    </div>
    <div class="ppx-rows glass" data-dc="pp/rows">
      <div class="ppx-r" data-act="toast" data-msg="疫苗：四联 2026-03 已接种，狂犬 2026-05 已接种（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#2f9e63;stroke-width:2.2;stroke-linecap:round"><path d="m9 12 2 2 4-5"/><path d="M12 3l7 4v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V7z"/></svg></span>疫苗记录<span class="sp"></span><span class="ar">›</span></div>
      <div class="ppx-r" data-act="toast" data-msg="体重曲线：近 3 月 +0.6kg，处于理想区间（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#d98a32;stroke-width:2.2;stroke-linecap:round"><path d="M4 18c4 0 5-8 8-8s4 5 8 5"/></svg></span>体重曲线<span class="sp"></span><span class="ar">›</span></div>
      <div class="ppx-r" data-act="toast" data-msg="健康提醒：下次体外驱虫 10-02（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#c9553e;stroke-width:2.2;stroke-linecap:round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>健康提醒<span class="sp"></span><span class="ar">›</span></div>
    </div>
    <div class="ppx-minis" data-dc="pp/minis">
      <div class="ppx-mini glass" data-act="toast" data-msg="团子：猫 · 1 岁（演示）"><img src="assets/pet-cat.png" alt=""><div><div class="n">团子</div><div class="s">猫 · 1 岁</div></div></div>
      <div class="ppx-mini glass" data-act="toast" data-msg="雪饼：兔 · 8 个月（演示）"><img src="assets/pet-bunny.png" alt=""><div><div class="n">雪饼</div><div class="s">兔 · 8 个月</div></div></div>
    </div>
  </div>
  <div class="ppx-tabs glass" data-dc="pp/tabs">
    <span data-goto="01-home">首页</span><span class="on" data-goto="02-pets">档案</span><span data-goto="03-map">地图</span><span data-goto="04-community">社区</span><span data-goto="05-me">我的</span>
  </div>
</div>
