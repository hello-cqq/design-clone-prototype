<style>
  .pz{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#fff;background:#241432}
  .pz .far{position:absolute;inset:0;background:url(assets/pp-stage.png) center/cover no-repeat;animation:kb 40s ease-in-out infinite alternate}
  @keyframes kb{from{background-size:108% auto}to{background-size:100% auto}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,20,50,.55),rgba(36,20,50,.15) 40%,rgba(36,20,50,.75))}
  .pz .top{position:absolute;left:16px;right:16px;top:48px;display:flex;align-items:center;z-index:6}
  .pz .top h1{font-size:17px;font-weight:600;margin:0;flex:1;text-align:center;text-shadow:0 2px 10px rgba(20,10,30,.6)}
  .pz .top .rh{background:linear-gradient(140deg,#ffb35c,#f28c2e);border-radius:999px;padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 8px 18px rgba(242,140,46,.4)}
  .pz .slots{position:absolute;left:12px;top:100px;z-index:6;display:flex;flex-direction:column;gap:8px}
  .pz .slots .s{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:6px 10px;font-size:10px;font-weight:600;cursor:pointer}
  .pz .slots .s img{width:26px;height:26px;border-radius:8px;object-fit:cover}
  .pz .slots .s.on{background:rgba(255,214,107,.32);border-color:rgba(255,214,107,.7)}
  .pz .ctrl{position:absolute;left:14px;right:14px;bottom:86px;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pz .ctrl span{border-radius:999px;padding:11px 4px;text-align:center;font-size:11.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);transition:transform .16s ease}
  .pz .ctrl span:active{transform:scale(.93)}
  .pz .ctrl span.play{background:linear-gradient(140deg,#ff8fb3,#e05589);border-color:transparent;box-shadow:0 10px 22px rgba(224,85,137,.45)}
  .pz .track{position:absolute;left:14px;right:14px;bottom:44px;z-index:8;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:9px 16px;font-size:11px;font-weight:600}
  .pz .track .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25);position:relative}
  .pz .track .bar i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:2px;background:linear-gradient(90deg,#ffd66b,#ff8fb3)}
  .pz .lights{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 30% 20%,rgba(255,143,179,.25),transparent 40%),radial-gradient(circle at 70% 15%,rgba(110,231,255,.22),transparent 42%),radial-gradient(circle at 50% 30%,rgba(255,214,107,.2),transparent 45%);animation:lg 3.2s ease-in-out infinite alternate}
  @keyframes lg{from{opacity:.55}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){.pz .far,.pz .lights{animation:none}}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far" data-fx-parallax="0.4"></div>
  <div class="lights" data-dc="pp/lights"></div>
  <div class="veil"></div>
  <canvas data-fx="particles" data-fx-kind="sparkles" data-fx-n="22" data-fx-colors="#ffd66b,#ff8fb3,#6ee7ff"></canvas>
  <div class="top"><span style="width:52px"></span><h1>动物乐队</h1><span class="rh" data-act="toast" data-msg="排练模式：分队练习（演示）">排练</span></div>
  <div class="slots" data-dc="pp/slots">
    <span class="s on" data-act="radio" data-group="slot"><img src="assets/pp-golden.png" alt="">主唱</span>
    <span class="s" data-act="radio" data-group="slot"><img src="assets/pp-ragdoll.png" alt="">键盘</span>
    <span class="s" data-act="radio" data-group="slot"><img src="assets/pp-fox.png" alt="">吉他</span>
    <span class="s" data-act="radio" data-group="slot"><img src="assets/pp-slider.png" alt="">鼓</span>
    <span class="s" data-act="radio" data-group="slot"><img src="assets/pp-dog.png" alt="">沙锤</span>
  </div>
  <div class="ctrl" data-dc="pp/ctrls">
    <span class="play" data-dc="pp/play" data-act="toggle" data-target="[data-dc='pp/lights']">播放</span>
    <span data-act="toast" data-msg="换歌：下一首《森林晨跑》（演示）">换歌</span>
    <span data-act="toast" data-msg="换装：舞台礼服系列（演示）">换装</span>
    <span data-act="toast" data-msg="表演已保存到乐园相册（演示）">保存表演</span>
  </div>
  <div class="track"><span>◀◀</span><div class="bar"><i></i></div><span>星光摇摆</span><span>▶▶</span></div>
</div>
