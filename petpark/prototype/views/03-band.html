<style>
  .pz{--color-bg:#241436;position:absolute;inset:0;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#ffeaf2;background:#241436}
  .pz .far{position:absolute;inset:0;overflow:hidden}
  .pz .far::before{content:"";position:absolute;inset:-7%;background:url(assets/pp-stage.png) center 30%/cover no-repeat;opacity:.92;animation:kb 40s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.01)}}
  .pz .lights{position:absolute;inset:0;background:radial-gradient(40% 30% at 30% 18%,rgba(255,143,179,.4),transparent 70%),radial-gradient(36% 28% at 72% 14%,rgba(110,231,255,.34),transparent 70%);animation:lg 3.2s ease-in-out infinite alternate}
  @keyframes lg{from{opacity:.55}to{opacity:1}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,20,54,.5),transparent 30%,transparent 60%,rgba(36,20,54,.88) 90%)}
  .pz .top{position:absolute;left:16px;right:16px;top:48px;display:flex;gap:8px;align-items:center;z-index:6}
  .pz .top .back{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;color:#7a3b5e;cursor:pointer}
  .pz .top .sp{flex:1}
  .pz .top .live{background:linear-gradient(140deg,#ff8fb3,#ff5e8a);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;color:#fff;box-shadow:0 8px 18px rgba(255,94,138,.4)}
  .pz .slots{position:absolute;left:16px;right:16px;bottom:150px;z-index:6;display:flex;gap:8px;justify-content:center}
  .pz .slots .s{width:52px;height:52px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.92);box-shadow:0 10px 22px rgba(20,8,32,.4);cursor:pointer;position:relative}
  .pz .slots .s img{width:100%;height:100%;object-fit:cover}
  .pz .slots .s.empty{display:grid;place-items:center;color:#b58ac4;font-size:16px;background:rgba(255,255,255,.28)}
  .pz .ctrl{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;z-index:6;display:flex;gap:26px;align-items:center}
  .pz .ctrl .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);cursor:pointer}
  .pz .ctrl .c.play{width:58px;height:58px;background:linear-gradient(140deg,#ff8fb3,#ff5e8a);box-shadow:0 12px 26px rgba(255,94,138,.5)}
  .pz .nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.92);border-radius:16px;padding:9px 2px 8px;display:grid;place-items:center;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(20,8,32,.3)}
  .pz .nav span.on{color:#e8557f;font-weight:600}
  @media (prefers-reduced-motion: reduce){.pz .far::before,.pz .lights{animation:none}}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far" data-fx-parallax="0.4"></div>
  <div class="lights"></div>
  <div class="veil"></div>
  <canvas data-fx="particles" data-fx-kind="sparkles" data-fx-n="22" data-fx-colors="#ffd66b,#ff8fb3,#6ee7ff"></canvas>
  <div class="top"><span class="back" data-goto="01-home">‹ 返回</span><span class="sp"></span><span class="live" data-dc="pp/band">LIVE · 动物乐队</span></div>
  <div class="slots" data-dc="pp/slots">
    <span class="s" data-act="radio" data-group="slot"><img src="assets/pp-fox.png" alt="耳廓狐" title="耳廓狐"></span>
    <span class="s" data-act="radio" data-group="slot"><img src="assets/pp-ragdoll.png" alt="布偶猫" title="布偶猫"></span>
    <span class="s" data-act="radio" data-group="slot"><img src="assets/pp-golden.png" alt="金毛" title="金毛"></span>
    <span class="s empty" data-act="toast" data-msg="空卡槽：去图鉴邀请新乐手（演示）">+</span>
    <span class="s empty" data-act="toast" data-msg="空卡槽：去图鉴邀请新乐手（演示）">+</span>
  </div>
  <div class="ctrl" data-dc="pp/ctrls">
    <span class="c" data-act="toast" data-msg="上一曲：晨间合唱（演示）"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round"><path d="M19 20 9 12l10-8v16z"/><path d="M5 19V5"/></svg></span>
    <span class="c play" data-act="toast" data-msg="播放中：星光圆舞曲 ♪（演示）"><svg width="22" height="22" viewBox="0 0 24 24" style="fill:#fff"><path d="M8 5v14l11-7z"/></svg></span>
    <span class="c" data-act="toast" data-msg="下一曲：河岸爵士（演示）"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round"><path d="m5 4 10 8-10 8V4z"/><path d="M19 5v14"/></svg></span>
  </div>
  <div class="nav" data-dc="pp/tabs"><span data-dc="pp/tab-home" data-goto="01-home">乐园</span><span data-goto="02-interact">动物</span><span class="on" data-goto="03-band">乐队</span><span data-goto="05-build">家园</span><span data-goto="07-tasks">任务</span></div>
</div>
