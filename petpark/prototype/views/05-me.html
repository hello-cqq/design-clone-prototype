<style>
  .ppx{position:relative;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#24402e;background:#dcefd8}
  .ppx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .ppx .L-far{background:url(assets/pp-bg.png) center/cover no-repeat;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .ppx .scroll{position:relative;z-index:4;padding:52px 16px 108px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 14px 34px rgba(36,64,46,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .ppx-me{display:flex;gap:14px;align-items:center;padding:16px;margin-bottom:12px}
  .ppx-me .ava{width:72px;height:72px;border-radius:50%;overflow:hidden;box-shadow:0 10px 24px rgba(36,64,46,.28), 0 0 0 3px rgba(255,255,255,.9);cursor:pointer}
  .ppx-me .ava img{width:100%;height:100%;object-fit:cover;animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  .ppx-me .nm{font-size:17px;font-weight:600}
  .ppx-me .sb{font-size:11px;color:#54705c;margin-top:3px}
  .ppx-me .edit{margin-left:auto;font-size:11px;font-weight:600;color:#20603c;background:rgba(255,255,255,.7);border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 4px 10px rgba(36,64,46,.14)}
  .ppx-vip{position:relative;overflow:hidden;padding:14px 16px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,233,168,.9),rgba(255,201,94,.82));border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 14px 34px rgba(180,130,30,.25), inset 0 1px 0 rgba(255,255,255,.85);cursor:pointer}
  .ppx-vip .t{font-size:13px;font-weight:600;color:#6b4409}
  .ppx-vip .s{font-size:10.5px;color:#8a6420;margin-top:4px}
  .ppx-vip .paw{position:absolute;right:12px;top:10px;opacity:.35}
  .ppx-rows{padding:6px 16px;margin-bottom:12px}
  .ppx-r{display:flex;align-items:center;gap:10px;padding:12px 2px;font-size:12.5px;font-weight:600;border-bottom:1px solid rgba(36,64,46,.08);cursor:pointer}
  .ppx-r:last-child{border-bottom:0}
  .ppx-r .ic{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.78);box-shadow:0 3px 8px rgba(36,64,46,.12)}
  .ppx-r .sp{flex:1}
  .ppx-r .ar{opacity:.45}
  .ppx-sw{width:42px;height:25px;border-radius:999px;background:rgba(36,64,46,.18);position:relative;cursor:pointer;transition:background .2s}
  .ppx-sw::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(36,64,46,.3);transition:left .2s cubic-bezier(.34,1.56,.64,1)}
  .ppx-sw.on{background:linear-gradient(140deg,#5ec98a,#2f9e63)}
  .ppx-sw.on::after{left:20px}
  .ppx-tabs{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .ppx-tabs span{font-size:12px;color:#54705c;cursor:pointer;padding:6px 13px;border-radius:999px}
  .ppx-tabs span.on{background:linear-gradient(140deg,#8fe0a8,#3fb873);color:#0d3a20;font-weight:600;box-shadow:0 6px 14px rgba(63,184,115,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.ppx .L-far,.ppx-me .ava img{animation:none}}
</style>
<div data-dc="pp/root" class="ppx">
  <div class="L L-far" data-fx-parallax="0.4"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="14" data-fx-colors="#ffffff,#ffe9a8"></canvas>
  <div class="scroll">
    <div class="ppx-me glass" data-dc="pp/me" data-fx-parallax="1.2">
      <span class="ava" data-act="toast" data-msg="头像：旺财（演示）"><img src="assets/pp-me.png" alt=""></span>
      <div><div class="nm">旺财家</div><div class="sb">3 只毛孩子 · 入园 42 次</div></div>
      <span class="edit" data-act="toast" data-msg="编辑资料（演示）">编辑</span>
    </div>
    <div class="ppx-vip" data-dc="pp/vip" data-act="toast" data-msg="金毛会员权益：免预约 2 次/月 + 咖啡区 9 折（演示）">
      <div class="t">金毛会员 · 2026-12 到期</div>
      <div class="s">免预约 2 次/月 · 咖啡区 9 折 · 生日礼包</div>
      <span class="paw"><svg width="40" height="40" viewBox="0 0 24 24" style="fill:#6b4409"><circle cx="7" cy="8" r="2.6"/><circle cx="12" cy="6" r="2.6"/><circle cx="17" cy="8" r="2.6"/><path d="M12 10c-3.4 0-6 2.6-6 5.4 0 1.6 1.2 2.6 2.8 2.6 1.2 0 2-.5 3.2-.5s2 .5 3.2.5c1.6 0 2.8-1 2.8-2.6 0-2.8-2.6-5.4-6-5.4z"/></svg></span>
    </div>
    <div class="ppx-rows glass" data-dc="pp/rows">
      <div class="ppx-r" data-act="toast" data-msg="我的预约：今天 14:00 草坪区（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#2f9e63;stroke-width:2.2;stroke-linecap:round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>我的预约<span class="sp"></span><span class="ar">›</span></div>
      <div class="ppx-r" data-act="toast" data-msg="优惠券：咖啡区 9 折 ×2、门票 -10 ×4（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#d98a32;stroke-width:2.2;stroke-linecap:round"><path d="M4 8a2 2 0 0 0 2-2h12a2 2 0 0 0 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v-3a2 2 0 0 0 0-4z"/></svg></span>优惠券<span class="sp"></span><span class="ar">›</span></div>
      <div class="ppx-r" data-act="toast" data-msg="入园提醒：已开启（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#5a8fd8;stroke-width:2.2;stroke-linecap:round"><path d="M12 3a9 9 0 0 0-9 9c0 3.9 3.1 7 7 7h1v3l4-4c3-.6 6-3.4 6-7a9 9 0 0 0-9-8z"/></svg></span>入园提醒<span class="sp"></span><span class="ppx-sw on" data-dc="pp/sw1" data-act="toggle" data-target="[data-dc='pp/sw1']"></span></div>
      <div class="ppx-r" data-act="toast" data-msg="帮助与客服：09:00-21:00 在线（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#c9553e;stroke-width:2.2;stroke-linecap:round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.3-.9 1-.9 1.7M12 17h.01"/></svg></span>帮助与客服<span class="sp"></span><span class="ar">›</span></div>
    </div>
  </div>
  <div class="ppx-tabs glass" data-dc="pp/tabs">
    <span data-goto="01-home">首页</span><span data-goto="02-pets">档案</span><span data-goto="03-map">地图</span><span data-goto="04-community">社区</span><span class="on" data-goto="05-me">我的</span>
  </div>
</div>
