<style>
  .pz{--color-bg:#e8f4d9;position:absolute;inset:0;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#4a3a1c;background:linear-gradient(180deg,#e8f4d9,#fff6e9)}
  .pz .far{position:absolute;inset:0;overflow:hidden}
  .pz .far::before{content:"";position:absolute;inset:-7%;background:url(assets/pp-grass.png) center 80%/cover no-repeat;opacity:.5;animation:kb 36s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.02)}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(232,244,217,.92),rgba(232,244,217,.5) 30%,rgba(255,246,233,.35))}
  .pz .hd{position:absolute;left:16px;right:16px;top:50px;z-index:6;display:flex;align-items:center;gap:8px}
  .pz .hd h1{font-size:17px;font-weight:600;margin:0;flex:1}
  .pz .hd .cnt{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;box-shadow:0 6px 14px rgba(91,58,30,.12)}
  .pz .grid{position:absolute;left:14px;right:14px;top:96px;bottom:86px;z-index:5;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
  .pz .cd{border-radius:18px;overflow:hidden;background:rgba(255,255,255,.94);box-shadow:0 10px 24px rgba(91,58,30,.14);cursor:pointer}
  .pz .cd img{display:block;width:100%;height:96px;object-fit:cover;object-position:50% 30%}
  .pz .cd .nm{padding:7px 9px 3px;font-size:11.5px;font-weight:600}
  .pz .cd .sb{padding:0 9px 8px;font-size:9.5px;color:#a07a4f}
  .pz .cd.lock{position:relative}
  .pz .cd.lock .sil{display:block;width:100%;height:96px;background:radial-gradient(52% 60% at 50% 42%,rgba(122,100,64,.4),rgba(122,100,64,.12) 70%,transparent),linear-gradient(160deg,#d8cdb8,#c9bda6)}
  .pz .cd.lock .sil::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:600;color:rgba(255,255,255,.85)}
  .pz .cd.lock img{display:none}
  .pz .nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.92);border-radius:16px;padding:9px 2px 8px;display:grid;place-items:center;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(91,58,30,.14)}
  .pz .nav span.on{color:#e8862f;font-weight:600}
  @media (prefers-reduced-motion: reduce){.pz .far::before{animation:none}}
</style>
