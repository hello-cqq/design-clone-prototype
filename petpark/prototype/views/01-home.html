<style>
  .pz{--color-bg:#fff6e9;position:absolute;inset:0;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#5b3a1e;background:#fff6e9}
  .pz .far{position:absolute;inset:0;overflow:hidden}
  .pz .far::before{content:"";position:absolute;inset:-7%;background:url(assets/pp-map.png) center/cover no-repeat;opacity:.9;animation:kb 36s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.07)}to{transform:scale(1.02)}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,246,233,.86),rgba(255,246,233,.25) 30%,rgba(255,246,233,.12) 55%,rgba(255,246,233,.9) 92%)}
  .pz .scroll{position:relative;z-index:4;height:100%;overflow-y:auto;padding:50px 14px 96px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
  .pz .res{display:flex;gap:8px;justify-content:center}
  .pz .res span{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 13px;font-size:11px;font-weight:600;box-shadow:0 6px 14px rgba(91,58,30,.12)}
  .pz .task{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:18px;padding:12px 14px;font-size:12.5px;font-weight:600;box-shadow:0 10px 24px rgba(91,58,30,.14)}
  .pz .task .go{margin-left:auto;border:0;border-radius:999px;padding:8px 16px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(140deg,#ffb35c,#f28c2e);cursor:pointer;box-shadow:0 8px 18px rgba(242,140,46,.4)}
  .pz .entries{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pz .en{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.94);box-shadow:0 12px 28px rgba(91,58,30,.16);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .pz .en:active{transform:scale(.96)}
  .pz .en img{display:block;width:100%;height:88px;object-fit:cover}
  .pz .en .lb{padding:9px 12px 4px;font-size:13px;font-weight:600}
  .pz .en .sb{padding:0 12px 10px;font-size:10px;color:#a07a4f}
  .pz .nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.92);border-radius:16px;padding:9px 2px 8px;display:grid;place-items:center;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(91,58,30,.14)}
  .pz .nav span.on{color:#e8862f;font-weight:600}
  @media (prefers-reduced-motion: reduce){.pz .far::before{animation:none}}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far" data-fx-parallax="0.4"></div>
  <div class="veil"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="16" data-fx-colors="#ffffff,#ffd66b,#c9f2d6"></canvas>
  <div class="scroll">
    <div class="res" data-dc="pp/res"><span>金币 1280</span><span>钻石 56</span><span>体力 92</span></div>
    <div class="task" data-dc="pp/task-daily">今天和 3 只动物互动<button class="go" data-dc="pp/start" data-goto="02-interact">去完成</button></div>
    <div class="entries" data-dc="pp/entries">
      <div class="en" data-goto="05-build"><img src="assets/pp-grass.png" alt=""><div class="lb">我的家园</div><div class="sb">空地待搭建 · 4 类素材</div></div>
      <div class="en" data-goto="03-band"><img src="assets/pp-stage.png" alt=""><div class="lb">乐队舞台</div><div class="sb">星光耀耀中 · 5 卡槽</div></div>
      <div class="en" data-goto="04-map"><img src="assets/pp-map.png" alt=""><div class="lb">地图导游</div><div class="sb">6 分区 · 向导耳廓狐</div></div>
      <div class="en" data-goto="06-dex"><img src="assets/pp-fox.png" alt=""><div class="lb">动物图鉴</div><div class="sb">已解锁 3 / 5</div></div>
    </div>
  </div>
  <div class="nav" data-dc="pp/tabs"><span class="on" data-dc="pp/tab-home" data-goto="01-home">乐园</span><span data-goto="02-interact">动物</span><span data-goto="03-band">乐队</span><span data-goto="05-build">家园</span><span data-goto="07-tasks">任务</span></div>
</div>
