<style>
  .ppx{position:relative;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#24402e;background:#dcefd8}
  .ppx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .ppx .L-far{background:url(assets/pp-bg.png) center/cover no-repeat;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .ppx .L-mid .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.7;animation:bob 6.4s ease-in-out infinite}
  .ppx .L-mid .o1{left:8%;top:14%;width:110px;height:110px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,214,107,.3) 70%)}
  .ppx .L-mid .o2{right:10%;top:34%;width:76px;height:76px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(126,220,195,.32) 70%);animation-delay:-2.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .ppx .scroll{position:relative;z-index:4;padding:52px 16px 108px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 14px 34px rgba(36,64,46,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .ppx-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ppx-head .logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(140deg,#5ec98a,#2f9e63);display:grid;place-items:center;box-shadow:0 8px 18px rgba(47,158,99,.4), inset 0 1px 0 rgba(255,255,255,.5)}
  .ppx-head .t{font-size:17px;font-weight:600}
  .ppx-head .sp{flex:1}
  .ppx-head .wx{font-size:11px;font-weight:600;color:#20603c;background:rgba(255,255,255,.66);border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 4px 10px rgba(36,64,46,.14)}
  .ppx-hero{position:relative;border-radius:24px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 40px rgba(36,64,46,.24)}
  .ppx-hero img{display:block;width:100%;height:230px;object-fit:cover;object-position:50% 42%;animation:breathe 4.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  .ppx-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(20,44,28,.42));pointer-events:none}
  .ppx-hero .cap{position:absolute;left:16px;bottom:14px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 2px 8px rgba(10,30,16,.6);cursor:pointer}
  .ppx-hero .badge{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.8);color:#20603c;font-size:10.5px;font-weight:600;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 6px 14px rgba(36,64,46,.25)}
  .ppx-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .ppx-a{padding:12px 8px;text-align:center;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .ppx-a:active{transform:scale(.95)}
  .ppx-a .ic{width:38px;height:38px;margin:0 auto 6px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.6));box-shadow:0 6px 14px rgba(36,64,46,.16), inset 0 1px 0 #fff}
  .ppx-a .lb{font-size:12px;font-weight:600}
  .ppx-a .sb{font-size:9.5px;color:#54705c;margin-top:2px}
  .ppx-pass{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px;cursor:pointer}
  .ppx-pass .qr{width:44px;height:44px;border-radius:10px;background:repeating-conic-gradient(#24402e 0 25%,#fff 0 50%) 0 0/11px 11px;box-shadow:0 4px 10px rgba(36,64,46,.2)}
  .ppx-pass .t{font-size:12.5px;font-weight:600}
  .ppx-pass .sb{font-size:10px;color:#54705c}
  .ppx-pass .sp{flex:1}
  .ppx-pass .ar{opacity:.4}
  .ppx-feed{padding:12px 14px}
  .ppx-feed .t{font-size:13px;font-weight:600;margin-bottom:8px}
  .ppx-feed .row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(36,64,46,.08)}
  .ppx-feed .row:last-child{border-bottom:0}
  .ppx-feed .row img{width:44px;height:44px;border-radius:12px;object-fit:cover}
  .ppx-feed .row .n{font-size:12px;font-weight:600}
  .ppx-feed .row .s{font-size:10px;color:#54705c}
  .ppx-feed .more{font-size:11px;color:#2f9e63;font-weight:600;margin-top:8px;cursor:pointer}
  .ppx-tabs{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .ppx-tabs span{font-size:12px;color:#54705c;cursor:pointer;padding:6px 13px;border-radius:999px}
  .ppx-tabs span.on{background:linear-gradient(140deg,#8fe0a8,#3fb873);color:#0d3a20;font-weight:600;box-shadow:0 6px 14px rgba(63,184,115,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.ppx .L-far,.ppx-hero img,.ppx .L-mid .orb{animation:none}}
</style>
<div data-dc="pp/root" class="ppx">
  <div class="L L-far" data-fx-parallax="0.4"></div>
  <div class="L L-mid" data-fx-parallax="0.9"><span class="orb o1"></span><span class="orb o2"></span></div>
  <canvas data-fx="particles" data-fx-kind="petals" data-fx-n="16" data-fx-colors="#ffffff,#ffe9a8,#c9f2d6"></canvas>
  <div class="scroll">
    <div class="ppx-head" data-dc="pp/head">
      <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" style="fill:#fff"><circle cx="7" cy="8" r="2.6"/><circle cx="12" cy="6" r="2.6"/><circle cx="17" cy="8" r="2.6"/><path d="M12 10c-3.4 0-6 2.6-6 5.4 0 1.6 1.2 2.6 2.8 2.6 1.2 0 2-.5 3.2-.5s2 .5 3.2.5c1.6 0 2.8-1 2.8-2.6 0-2.8-2.6-5.4-6-5.4z"/></svg></span>
      <span class="t">云朵宠物乐园</span><span class="sp"></span>
      <span class="wx" data-act="toast" data-msg="今日晴朗 26° · 适宜出游（演示）">晴 26° · 优</span>
    </div>
    <div class="ppx-hero" data-dc="pp/hero" data-fx-parallax="1.2">
      <img src="assets/pp-home.png" alt="" data-act="toast" data-msg="旺财：汪！今天去草坪区玩（演示）">
      <span class="badge" data-act="toast" data-msg="园区营业中 09:00-21:00（演示）">营业中 · 09–21 点</span>
      <span class="cap" data-goto="03-map">查看乐园地图 →</span>
    </div>
    <div class="ppx-acts" data-dc="pp/acts">
      <div class="ppx-a glass" data-act="sheet" data-title="预约入园" data-items="今天 14:00|今天 16:00|明天 10:00"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:#2f9e63;stroke-width:2.2;stroke-linecap:round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><div class="lb">预约入园</div><div class="sb">今日 6 席</div></div>
      <div class="ppx-a glass" data-act="toast" data-msg="已为你匹配遛伴：豆豆（柯基 · 2 岁）（演示）"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:#d98a32;stroke-width:2.2;stroke-linecap:round"><circle cx="9" cy="8" r="3.4"/><path d="M3 19c1-3.4 3.4-4.6 6-4.6s5 1.2 6 4.6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 14.6c2.6.2 4.4 1.4 5.5 4.4"/></svg></span><div class="lb">找遛伴</div><div class="sb">在线 12 位</div></div>
      <div class="ppx-a glass" data-act="toast" data-msg="打卡成功：草坪区 +5 积分（演示）"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:#7a52c7;stroke-width:2.2;stroke-linecap:round"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 5.9L12 16.4 6.7 19.3l1.2-5.9L3.4 9.3l6-.7z"/></svg></span><div class="lb">打卡积分</div><div class="sb">+5 / 次</div></div>
    </div>
    <div class="ppx-pass glass" data-dc="pp/pass" data-act="toast" data-msg="入园码已刷新（演示）">
      <span class="qr"></span>
      <div><div class="t">我的入园码</div><div class="sb">旺财 + 1 位同伴 · 有效至今日 21:00</div></div>
      <span class="sp"></span><span class="ar">›</span>
    </div>
    <div class="ppx-feed glass" data-dc="pp/feed">
      <div class="t">乐园此刻</div>
      <div class="row"><img src="assets/pp-pets.png" alt=""><div><div class="n">草坪区 · 飞盘局进行中</div><div class="s">8 只毛孩子 · 3 位主人</div></div></div>
      <div class="row"><img src="assets/pp-me.png" alt=""><div><div class="n">咖啡区 · 新到低敏燕麦饼干</div><div class="s">人宠共餐 · 9 折券可用</div></div></div>
      <div class="more" data-goto="04-community">去社区看更多 →</div>
    </div>
  </div>
  <div class="ppx-tabs glass" data-dc="pp/tabs">
    <span class="on" data-goto="01-home">首页</span><span data-goto="02-pets">档案</span><span data-goto="03-map">地图</span><span data-goto="04-community">社区</span><span data-goto="05-me">我的</span>
  </div>
</div>
