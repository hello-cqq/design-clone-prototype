<style>
  .pz{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#5b3a1e;background:#fff6e9}
  .pz .far{position:absolute;inset:0;background:url(assets/pp-map.png) center/cover no-repeat;opacity:.9;animation:kb 36s ease-in-out infinite alternate}
  @keyframes kb{from{background-size:110% auto}to{background-size:103% auto}}
  .pz .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,246,233,.2),rgba(255,246,233,.55) 60%,rgba(255,246,233,.9))}
  .pz .scroll{position:relative;z-index:4;padding:50px 14px 108px;box-sizing:border-box}
  .pz .res{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
  .pz .res span{background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;box-shadow:0 4px 10px rgba(91,58,30,.12)}
  .pz .task{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:18px;padding:12px 14px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 10px 24px rgba(91,58,30,.14);margin-bottom:12px}
  .pz .task .b{margin-left:auto;background:linear-gradient(140deg,#ffb35c,#f28c2e);color:#fff;border-radius:999px;padding:5px 12px;font-size:10.5px;cursor:pointer}
  .pz .entries{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pz .en{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:20px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 12px 26px rgba(91,58,30,.15);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .pz .en:active{transform:scale(.95)}
  .pz .en img{width:64px;height:64px;border-radius:18px;object-fit:cover}
  .pz .en .lb{font-size:12.5px;font-weight:600;margin-top:6px}
  .pz .en .sb{font-size:10px;color:#8a6440}
  .pz .nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pz .nav span{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:16px;padding:9px 2px 8px;display:grid;place-items:center;gap:3px;font-size:10.5px;color:#8a6440;cursor:pointer;box-shadow:0 8px 20px rgba(91,58,30,.14)}
  .pz .nav span.on{color:#e8862f;font-weight:600}
  @media (prefers-reduced-motion: reduce){.pz .far{animation:none}}
</style>
<div data-dc="pp/root" class="pz">
  <div class="far" data-fx-parallax="0.4"></div>
  <div class="veil"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="16" data-fx-colors="#ffffff,#ffd66b,#c9f2d6"></canvas>
  <div class="scroll">
    <div class="res" data-dc="pp/res"><span>金币 1280</span><span>钻石 56</span><span>体力 92</span></div>
    <div class="task" data-dc="pp/task">今天和 3 只动物互动<span class="b" data-act="toast" data-msg="任务详情：互动 1/3（演示）">去完成</span></div>
    <div class="entries">
      <div class="en" data-dc="pp/entry-home" data-goto="05-build"><img src="assets/pp-grass.png" alt=""><div class="lb">我的家园</div><div class="sb">空地待搭建</div></div>
      <div class="en" data-dc="pp/entry-stage" data-goto="03-band"><img src="assets/pp-stage.png" alt=""><div class="lb">乐队舞台</div><div class="sb">星光摇摆中</div></div>
    </div>
  </div>
  <div class="nav" data-dc="pp/tabs"><span class="on" data-dc="pp/tab-home" data-goto="01-home">乐园</span><span data-goto="02-interact">动物</span><span data-goto="03-band">乐队</span><span data-goto="05-build">家园</span><span data-goto="07-tasks">任务</span></div>
</div>
