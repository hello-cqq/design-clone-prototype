<style>
  .ppx{position:relative;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#24402e;background:#dcefd8}
  .ppx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .ppx .L-far{background:url(assets/pp-community.png) center/cover no-repeat;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .ppx .L-veil{background:linear-gradient(180deg,rgba(220,239,216,.86),rgba(220,239,216,.94) 30%)}
  .ppx .scroll{position:relative;z-index:4;padding:52px 16px 108px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 14px 34px rgba(36,64,46,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .ppx-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ppx-head .t{font-size:17px;font-weight:600}
  .ppx-head .sp{flex:1}
  .ppx-head .pub{padding:8px 14px;border-radius:999px;font-size:11.5px;font-weight:600;color:#0d3a20;background:linear-gradient(140deg,#8fe0a8,#3fb873);cursor:pointer;box-shadow:0 6px 14px rgba(63,184,115,.4), inset 0 1px 0 rgba(255,255,255,.6)}
  .ppx-post{padding:14px 16px;margin-bottom:12px}
  .ppx-post .who{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .ppx-post .who img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 4px 10px rgba(36,64,46,.22), 0 0 0 2px rgba(255,255,255,.9)}
  .ppx-post .who .n{font-size:12.5px;font-weight:600}
  .ppx-post .who .s{font-size:10px;color:#54705c}
  .ppx-post .ph{position:relative;border-radius:16px;overflow:hidden;margin-bottom:10px}
  .ppx-post .ph img{display:block;width:100%;height:170px;object-fit:cover;animation:breathe 5.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
  .ppx-post .tx{font-size:12px;line-height:1.8;color:#3c5a44}
  .ppx-post .bar{display:flex;gap:18px;margin-top:10px}
  .ppx-post .bar span{display:flex;gap:6px;align-items:center;font-size:11px;color:#54705c;cursor:pointer}
  .ppx-post .bar .heart.on svg{fill:#e0566e;stroke:#e0566e}
  .ppx-tabs{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .ppx-tabs span{font-size:12px;color:#54705c;cursor:pointer;padding:6px 13px;border-radius:999px}
  .ppx-tabs span.on{background:linear-gradient(140deg,#8fe0a8,#3fb873);color:#0d3a20;font-weight:600;box-shadow:0 6px 14px rgba(63,184,115,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.ppx .L-far,.ppx-post .ph img{animation:none}}
</style>
<div data-dc="pp/root" class="ppx">
  <div class="L L-far" data-fx-parallax="0.4"></div>
  <div class="L L-veil" data-fx-parallax="0.7"></div>
  <canvas data-fx="particles" data-fx-kind="petals" data-fx-n="14" data-fx-colors="#ffffff,#ffe9a8,#f2c4ce"></canvas>
  <div class="scroll">
    <div class="ppx-head" data-dc="pp/head">
      <span class="t">乐园社区</span><span class="sp"></span>
      <span class="pub" data-act="sheet" data-title="发布动态" data-items="拍照|选图|文字">发布</span>
    </div>
    <div class="ppx-post glass" data-dc="pp/post1">
      <div class="who"><img src="assets/pp-me.png" alt=""><div><div class="n">旺财家</div><div class="s">草坪区 · 10 分钟前</div></div></div>
      <div class="ph"><img src="assets/pp-community.png" alt=""></div>
      <div class="tx">飞盘局新纪录：旺财今天接住了 9 次！金毛豆豆紧随其后 8 次，下周再战。</div>
      <div class="bar"><span class="heart on" data-act="toggle"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg>128</span><span data-act="toast" data-msg="评论 32 条（演示）"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>32</span><span data-act="toast" data-msg="已收藏（演示）"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="m12 4 2.4 5 5.6.6-4.2 3.8 1.2 5.6-5-2.8-5 2.8 1.2-5.6L4 9.6 9.6 9z"/></svg></span></div>
    </div>
    <div class="ppx-post glass" data-dc="pp/post2">
      <div class="who"><img src="assets/pp-pets.png" alt=""><div><div class="n">三宠同框</div><div class="s">原木区 · 1 小时前</div></div></div>
      <div class="ph"><img src="assets/pp-pets.png" alt="" style="object-position:50% 55%"></div>
      <div class="tx">柯基+柴犬+垂耳兔的原木合影，园长说这是本月最佳园容照片。</div>
      <div class="bar"><span class="heart" data-act="toggle"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg>96</span><span data-act="toast" data-msg="评论 19 条（演示）"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>19</span><span data-act="toast" data-msg="已报名飞盘局（演示）"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="M4 12h16M14 6l6 6-6 6"/></svg>报名</span></div>
    </div>
    <div class="ppx-post glass" data-dc="pp/post3">
      <div class="who"><img src="assets/pet-bunny.png" alt=""><div><div class="n">雪饼家</div><div class="s">咖啡区 · 3 小时前</div></div></div>
      <div class="tx">第一次带雪饼来咖啡区，低敏燕麦饼干吃到停不下来，店员说下次要限量了。</div>
      <div class="bar"><span class="heart" data-act="toggle"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg>54</span><span data-act="toast" data-msg="评论 8 条（演示）"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>8</span><span data-act="toast" data-msg="已收藏（演示）"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#54705c;stroke-width:2.1"><path d="m12 4 2.4 5 5.6.6-4.2 3.8 1.2 5.6-5-2.8-5 2.8 1.2-5.6L4 9.6 9.6 9z"/></svg></span></div>
    </div>
  </div>
  <div class="ppx-tabs glass" data-dc="pp/tabs">
    <span data-goto="01-home">首页</span><span data-goto="02-pets">档案</span><span data-goto="03-map">地图</span><span class="on" data-goto="04-community">社区</span><span data-goto="05-me">我的</span>
  </div>
</div>
