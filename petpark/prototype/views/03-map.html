<style>
  .ppx{position:relative;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#24402e;background:#dcefd8}
  .ppx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .ppx .L-far{background:url(assets/pp-bg.png) center/cover no-repeat;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .ppx .scroll{position:relative;z-index:4;padding:52px 16px 108px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 14px 34px rgba(36,64,46,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .ppx-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ppx-head .t{font-size:17px;font-weight:600}
  .ppx-head .sp{flex:1}
  .ppx-head .loc{font-size:11px;font-weight:600;color:#20603c;background:rgba(255,255,255,.66);border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 4px 10px rgba(36,64,46,.14)}
  .ppx-map{position:relative;border-radius:24px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 40px rgba(36,64,46,.22)}
  .ppx-map img{display:block;width:100%;height:250px;object-fit:cover;animation:drift 26s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.12) translate(-2%,1.5%)}}
  .ppx-pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 4px;display:grid;place-items:center;background:linear-gradient(140deg,#8fe0a8,#3fb873);box-shadow:0 8px 16px rgba(20,60,36,.4), inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;animation:bob 3.6s ease-in-out infinite}
  .ppx-pin.b{background:linear-gradient(140deg,#8ecdf0,#3f8ec9);animation-delay:-1.2s}
  .ppx-pin.c{background:linear-gradient(140deg,#ffd98a,#e8a53c);animation-delay:-2.2s}
  .ppx-pin.d{background:linear-gradient(140deg,#f2b3c1,#d86a84);animation-delay:-3s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .ppx-sheet{padding:14px 16px;margin-bottom:12px}
  .ppx-sheet .t{font-size:13px;font-weight:600;margin-bottom:10px}
  .ppx-zones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .ppx-z{padding:8px 14px;border-radius:999px;font-size:11.5px;font-weight:600;color:#3c5a44;cursor:pointer;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8)}
  .ppx-z.on{background:linear-gradient(140deg,#8fe0a8,#3fb873);color:#0d3a20;border-color:transparent;box-shadow:0 8px 18px rgba(63,184,115,.4)}
  .ppx-slots{display:flex;gap:8px;margin-bottom:12px}
  .ppx-s{flex:1;padding:10px 6px;border-radius:14px;text-align:center;font-size:11px;font-weight:600;color:#3c5a44;cursor:pointer;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8)}
  .ppx-s.on{background:linear-gradient(140deg,#ffe9a8,#ffc95e);color:#7a4a12;border-color:transparent;box-shadow:0 8px 18px rgba(255,201,94,.42)}
  .ppx-cta{width:100%;padding:12px;border:0;border-radius:16px;font-size:13px;font-weight:600;color:#0d3a20;background:linear-gradient(140deg,#8fe0a8,#3fb873);cursor:pointer;box-shadow:0 10px 22px rgba(63,184,115,.42), inset 0 1px 0 rgba(255,255,255,.6)}
  .ppx-tabs{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .ppx-tabs span{font-size:12px;color:#54705c;cursor:pointer;padding:6px 13px;border-radius:999px}
  .ppx-tabs span.on{background:linear-gradient(140deg,#8fe0a8,#3fb873);color:#0d3a20;font-weight:600;box-shadow:0 6px 14px rgba(63,184,115,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.ppx .L-far,.ppx-map img,.ppx-pin{animation:none}}
</style>
<div data-dc="pp/root" class="ppx">
  <div class="L L-far" data-fx-parallax="0.4"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="12" data-fx-colors="#ffffff,#c9f2d6"></canvas>
  <div class="scroll">
    <div class="ppx-head" data-dc="pp/head">
      <span class="t">乐园地图</span><span class="sp"></span>
      <span class="loc" data-act="toast" data-msg="已定位：云朵宠物乐园 · 1 号门（演示）">1 号门 · 已定位</span>
    </div>
    <div class="ppx-map" data-dc="pp/map" data-fx-parallax="1.2">
      <img src="assets/pp-map.png" alt="">
      <span class="ppx-pin" style="left:22%;top:30%" data-act="toast" data-msg="草坪区：开放中 · 当前 12 只（演示）"><svg width="14" height="14" viewBox="0 0 24 24" style="fill:#fff"><path d="M4 20c2-6 5-9 8-9s6 3 8 9c-3-1.5-5-2-8-2s-5 .5-8 2z"/></svg></span>
      <span class="ppx-pin b" style="left:58%;top:22%" data-act="toast" data-msg="戏水区：水温 28° · 需穿救生衣（演示）"><svg width="14" height="14" viewBox="0 0 24 24" style="fill:#fff"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg></span>
      <span class="ppx-pin c" style="left:70%;top:56%" data-act="toast" data-msg="猫爬架区：限猫咪 · 3 层攀爬（演示）"><svg width="14" height="14" viewBox="0 0 24 24" style="fill:#fff"><circle cx="12" cy="10" r="4"/><path d="M6 20c1-4 3-5 6-5s5 1 6 5z"/></svg></span>
      <span class="ppx-pin d" style="left:30%;top:64%" data-act="toast" data-msg="宠物咖啡区：人宠共餐 · 有低敏菜单（演示）"><svg width="14" height="14" viewBox="0 0 24 24" style="fill:#fff"><path d="M5 8h11v6a5 5 0 0 1-10 0zM16 9h2a3 3 0 0 1 0 6h-2z"/></svg></span>
    </div>
    <div class="ppx-sheet glass" data-dc="pp/sheet">
      <div class="t">预约区域与时段</div>
      <div class="ppx-zones" data-dc="pp/zones">
        <span class="ppx-z on" data-act="radio" data-group="zone">草坪区</span>
        <span class="ppx-z" data-act="radio" data-group="zone">戏水区</span>
        <span class="ppx-z" data-act="radio" data-group="zone">猫爬架区</span>
        <span class="ppx-z" data-act="radio" data-group="zone">咖啡区</span>
      </div>
      <div class="ppx-slots" data-dc="pp/slots">
        <span class="ppx-s on" data-act="radio" data-group="slot">今天 14:00</span>
        <span class="ppx-s" data-act="radio" data-group="slot">今天 16:00</span>
        <span class="ppx-s" data-act="radio" data-group="slot">明天 10:00</span>
      </div>
      <button class="ppx-cta" data-act="toast" data-msg="预约成功：草坪区 今天 14:00（演示）">确认预约</button>
    </div>
  </div>
  <div class="ppx-tabs glass" data-dc="pp/tabs">
    <span data-goto="01-home">首页</span><span data-goto="02-pets">档案</span><span class="on" data-goto="03-map">地图</span><span data-goto="04-community">社区</span><span data-goto="05-me">我的</span>
  </div>
</div>
