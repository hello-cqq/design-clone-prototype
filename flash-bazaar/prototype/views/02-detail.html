<style>
  .bv{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#22343c;background:#fff3ea}
  .bv .far{position:absolute;inset:0;background:url(assets/bv-bg.png) center/cover;opacity:.5;animation:kb 36s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.1)}to{transform:scale(1.03)}}
  .bv .scroll{position:relative;z-index:4;padding:52px 16px 108px;box-sizing:border-box}
  .bv h1{font-size:18px;font-weight:600;margin:0 2px 4px}
  .bv .fn{font-size:11px;color:#22343c99;margin:0 2px 12px}
  .bv .glass{background:rgba(255,255,255,.66);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 14px 32px rgba(20,40,50,.14), inset 0 1px 0 rgba(255,255,255,.9);padding:14px;margin-bottom:12px}
  .bv .hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 40px rgba(20,40,50,.2)}
  .bv .hero img{display:block;width:100%;height:220px;object-fit:cover;object-position:50% 30%;animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}
  .bv .chips{display:flex;flex-wrap:wrap;gap:8px}
  .bv-chip{padding:8px 14px;border-radius:999px;font-size:11.5px;font-weight:600;color:#22343ccc;cursor:pointer;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
  .bv-chip.on{background:linear-gradient(140deg,#ff5a3c,#ffd166);color:#fff;border-color:transparent;box-shadow:0 8px 18px #ff5a3c66}
  .bv-row{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:12px;font-weight:600;border-bottom:1px solid rgba(20,40,50,.08)}
  .bv-row:last-child{border-bottom:0}
  .bv-row .sp{flex:1}
  .bv-sw{width:40px;height:24px;border-radius:999px;background:rgba(20,40,50,.18);position:relative;cursor:pointer}
  .bv-sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
  .bv-sw.on{background:#ff5a3c}
  .bv-sw.on::after{left:19px}
  .bv-sl{width:110px;height:6px;border-radius:3px;background:rgba(20,40,50,.15);position:relative;cursor:pointer}
  .bv-sl i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#ff5a3c}
  .bv-btn{display:inline-block;margin:4px 6px 0 0;padding:10px 18px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(140deg,#ff5a3c,#ffd166);cursor:pointer;box-shadow:0 10px 22px #ff5a3c55, inset 0 1px 0 rgba(255,255,255,.5)}
  .bv-btn.ghost{background:rgba(255,255,255,.75);color:#22343c}
  .bv-nav{position:absolute;left:12px;right:12px;bottom:20px;z-index:8;display:flex;gap:8px}
  .bv-nav span{flex:1;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:16px;padding:10px 2px;text-align:center;font-size:10.5px;color:#22343c99;cursor:pointer;box-shadow:0 8px 20px rgba(20,40,50,.14)}
  .bv-nav span.on{color:#ff5a3c;font-weight:600}
  @media (prefers-reduced-motion: reduce){.bv .far,.bv .hero img{animation:none}}
</style>
<div data-dc="bv/root" class="bv">
  <div class="far" data-fx-parallax="0.4"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="16" data-fx-colors="#ffffff,#ff5a3c,#ffd166"></canvas>
  <div class="scroll" data-fx-parallax="1.1">
    <div class="hero"><img src="assets/bv-char.png" alt=""></div>
    <h1>商品详情</h1>
    <p class="fn">轮播+规格+领券</p>
    <div class="glass"><div class="chips"><span class="bv-chip on" data-dc="co/spec" data-act="radio" data-group="co/spec">spec</span><span class="bv-btn" data-dc="co/coupon" data-act="toast" data-msg="券入包（演示）">coupon</span></div></div>
    <div class="glass"><div class="bv-row">轮播图<span class="sp"></span>·</div><div class="bv-row">规格胶囊<span class="sp"></span>·</div><div class="bv-row">领券条<span class="sp"></span>·</div></div>
  </div>
  <div class="bv-nav"><span class="" data-goto="01-home">秒杀主场</span><span class="on" data-goto="02-detail">商品详情</span><span class="" data-goto="03-cart">购物车</span><span class="" data-goto="04-pay">收银台</span></div>
</div>
