name: index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: node scripts/thumb.mjs
      - run: node scripts/index.mjs
      - name: commit back index + thumbs
        run: |
          git config user.name "dc-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.json || true
          git add -A -- '*/thumb.png' || true
          git status --porcelain || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(index): rebuild index.json + thumbnails"
            git push
          else
            echo "nothing to commit"
          fi
