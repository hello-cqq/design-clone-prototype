<style>
  .asx{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#12333f;background:#bfe3ef}
  .asx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .asx .L-far{width:100%;height:100%;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .asx .L-mid .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.7;animation:bob 7s ease-in-out infinite}
  .asx .L-mid .o1{right:10%;top:14%;width:100px;height:100px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,214,107,.3) 70%)}
  .asx .L-mid .o2{left:8%;bottom:30%;width:70px;height:70px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(140,230,220,.3) 70%);animation-delay:-3.4s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .asx .scroll{position:relative;z-index:4;padding:52px 16px 110px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.58);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 14px 34px rgba(18,60,80,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .asx-me{display:flex;gap:14px;align-items:center;padding:16px;margin-bottom:14px}
  .asx-me .ava{position:relative;width:74px;height:74px;border-radius:50%;overflow:hidden;box-shadow:0 10px 24px rgba(18,60,80,.28), 0 0 0 3px rgba(255,255,255,.9);cursor:pointer}
  .asx-me .ava img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  .asx-me .nm{font-size:18px;font-weight:600}
  .asx-me .pro{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;color:#7a4a12;background:linear-gradient(140deg,#ffe9a8,#ffc95e);border-radius:999px;padding:3px 9px;box-shadow:0 4px 10px rgba(255,201,94,.45)}
  .asx-me .sb{font-size:11px;color:#4a6b78;margin-top:4px}
  .asx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .asx-st{padding:12px 6px;text-align:center}
  .asx-st b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;color:#0f4a5a}
  .asx-st span{font-size:10px;color:#4a6b78}
  .asx-rows{padding:6px 16px;margin-bottom:14px}
  .asx-r{display:flex;align-items:center;gap:10px;padding:12px 2px;font-size:12.5px;font-weight:600;border-bottom:1px solid rgba(18,60,80,.08)}
  .asx-r:last-child{border-bottom:0}
  .asx-r .ic{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(18,60,80,.12)}
  .asx-r .sp{flex:1}
  .asx-r .ar{opacity:.45}
  .asx-sw{width:42px;height:25px;border-radius:999px;background:rgba(18,60,80,.18);position:relative;cursor:pointer;transition:background .2s}
  .asx-sw::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(18,60,80,.3);transition:left .2s cubic-bezier(.34,1.56,.64,1)}
  .asx-sw.on{background:linear-gradient(140deg,#5ad0b4,#2ba98c)}
  .asx-sw.on::after{left:20px}
  .asx-tabs{position:absolute;left:14px;right:14px;bottom:24px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .asx-tabs span{font-size:12px;color:#4a6b78;cursor:pointer;padding:6px 13px;border-radius:999px}
  .asx-tabs span.on{background:linear-gradient(140deg,#ffd9c2,#ff9d68);color:#8a3a12;font-weight:600;box-shadow:0 6px 14px rgba(255,157,104,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.asx .L-far,.asx-me .ava img,.asx .L-mid .orb{animation:none}}
</style>
<div data-dc="as/root" class="asx">

      <div class="asx-r"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#1fa083;stroke-width:2.2;stroke-linecap:round"><path d="M12 3a9 9 0 0 0-9 9c0 3.9 3.1 7 7 7h1v3l4-4c3-.6 6-3.4 6-7a9 9 0 0 0-9-8z"/></svg></span>消息通知<span class="sp"></span><span class="asx-sw on" data-dc="as/sw1" data-act="toggle" data-target="[data-dc='as/sw1']"></span></div>
      <div class="asx-r"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#2b83c9;stroke-width:2.2;stroke-linecap:round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></span>昼夜自动换肤<span class="sp"></span><span class="asx-sw on" data-dc="as/sw2" data-act="toggle" data-target="[data-dc='as/sw2']"></span></div>
      <div class="asx-r"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#7a52c7;stroke-width:2.2;stroke-linecap:round"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>端到端加密<span class="sp"></span><span class="asx-sw" data-dc="as/sw3" data-act="toggle" data-target="[data-dc='as/sw3']"></span></div>
      <div class="asx-r" data-act="toast" data-msg="帮助与客服：09:00-21:00 在线（演示）"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#d96f32;stroke-width:2.2;stroke-linecap:round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.3-.9 1-.9 1.7M12 17h.01"/></svg></span>帮助与客服<span class="sp"></span><span class="ar">›</span></div>
    </div>
  </div>
  <div class="asx-tabs glass" data-dc="as/tabs">
    <span data-goto="01-home">首页</span><span data-goto="02-chat">聊天</span><span data-goto="03-call">通话</span><span data-goto="04-persona">形象</span><span class="on" data-goto="05-me">我的</span>
  </div>
</div>
