<style>
  .xh-s{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#17364f;background:linear-gradient(180deg,#eaf4ff,#f6fbff)}
  .xh-s .far{position:absolute;inset:0;background:url(assets/xh-bg-day.png) center/cover;opacity:.3;animation:kb 36s ease-in-out infinite alternate}
  .xh-s.nightbg .far{background-image:url(assets/xh-bg-night.png)}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .xh-s .scroll{position:relative;z-index:4;padding:52px 16px 112px;box-sizing:border-box}
  .xh-s h2{font-size:17px;font-weight:600;margin:2px 2px 10px}
  .xh-s .glass{background:rgba(255,255,255,.68);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.85);border-radius:22px;box-shadow:0 14px 34px rgba(23,54,79,.14), inset 0 1px 0 rgba(255,255,255,.9)}
  .xh-s .prev{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:12px}
  .xh-s .prev img{width:84px;height:104px;object-fit:cover;object-position:50% 22%;border-radius:16px;box-shadow:0 10px 24px rgba(23,54,79,.24), 0 0 0 2px #fff}
  .xh-s .prev .nm{font-size:16px;font-weight:600}
  .xh-s .prev .sb{font-size:11px;color:#5b7d97;margin-top:4px}
  .xh-s .grp{padding:14px 16px;margin-bottom:12px}
  .xh-s .grp .t{font-size:13px;font-weight:600;margin-bottom:10px}
  .xh-s .row{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:12.5px;font-weight:600;border-bottom:1px solid rgba(23,54,79,.08);cursor:pointer}
  .xh-s .row:last-child{border-bottom:0}
  .xh-s .row .sp{flex:1}
  .xh-s .row .rd{width:18px;height:18px;border-radius:50%;border:2px solid #b9d2e6;position:relative}
  .xh-s .row.on .rd{border-color:#3f86d6}
  .xh-s .row.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#3f86d6}
  .xh-s .chips{display:flex;flex-wrap:wrap;gap:8px}
  .xh-s .chip{padding:8px 15px;border-radius:999px;font-size:11.5px;font-weight:600;color:#3f6c8f;cursor:pointer;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
  .xh-s .chip.on{background:linear-gradient(140deg,#6db5f0,#3f86d6);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(63,134,214,.4)}
  .xh-s .save{width:100%;padding:12px;border:0;border-radius:16px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(140deg,#6db5f0,#3f86d6);cursor:pointer;box-shadow:0 10px 24px rgba(63,134,214,.42), inset 0 1px 0 rgba(255,255,255,.5)}
  .xh-s .nav{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .xh-s .nav span{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:18px;padding:10px 4px 9px;display:grid;place-items:center;gap:4px;font-size:11px;color:#3f6c8f;cursor:pointer;box-shadow:0 10px 24px rgba(23,54,79,.14)}
  .xh-s .nav span.on{color:#2b76c8;font-weight:600}
  @media (prefers-reduced-motion: reduce){.xh-s .far{animation:none}}
</style>
<div data-dc="as/root" class="xh-s">
  <div class="far" data-fx-parallax="0.4"></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="14" data-fx-colors="#ffffff,#bcd8f2"></canvas>
  <div class="scroll">
    <h2>设置 · 形象与音色</h2>
    <div class="prev glass" data-dc="as/personas"><img src="assets/xh-xinghai.png" alt=""><div><div class="nm">星海 · 夜星空</div><div class="sb">清冷少年音 · 适合深夜问答</div></div></div>
    <div class="grp glass">
      <div class="t">音色</div>
      <div class="chips" data-dc="as/voices">
        <span class="chip on" data-act="radio" data-group="voice">少年音</span>
        <span class="chip" data-act="radio" data-group="voice">少女音</span>
        <span class="chip" data-act="radio" data-group="voice">清冷音</span>
        <span class="chip" data-act="radio" data-group="voice">暖阳音</span>
      </div>
    </div>
    <div class="grp glass">
      <div class="t">背景</div>
      <div class="chips" data-dc="as/bgs">
        <span class="chip on" data-act="radio" data-group="bg">星空</span>
        <span class="chip" data-act="radio" data-group="bg">晴空</span>
      </div>
    </div>
    <div class="grp glass">
      <div class="t">形象</div>
      <div class="row on" data-act="radio" data-group="persona"><span class="rd"></span>星海 · 深蓝短发少年<span class="sp"></span></div>
      <div class="row" data-act="radio" data-group="persona"><span class="rd"></span>海汐 · 黑短发少女<span class="sp"></span></div>
    </div>
    <button class="save" data-act="toast" data-msg="已保存：星海 + 清冷音 + 星空背景（演示）">保存设置</button>
  </div>
  <div class="nav" data-dc="as/tabs"><span data-dc="as/tab-home" data-goto="01-home"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><path d="m4 11 8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>首页</span><span data-dc="as/tab-chat" data-goto="02-chat"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><rect x="4" y="4" width="16" height="13" rx="3"/><path d="M9 21l3-4 3 4"/></svg>对话</span><span data-dc="as/tab-call" data-goto="03-call"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>视频</span><span class="on" data-goto="04-settings"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>设置</span></div>
</div>
