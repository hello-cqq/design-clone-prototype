<style>
  .asx{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#12333f;background:#bfe3ef}
  .asx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .asx .L-far{width:100%;height:100%;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .asx .L-mid .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.7;animation:bob 6.5s ease-in-out infinite}
  .asx .L-mid .o1{left:6%;top:16%;width:110px;height:110px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(199,146,255,.3) 70%)}
  .asx .L-mid .o2{right:8%;bottom:26%;width:90px;height:90px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(110,231,255,.3) 70%);animation-delay:-3s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .asx .scroll{position:relative;z-index:4;padding:52px 16px 110px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.58);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 14px 34px rgba(18,60,80,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .asx-h{font-size:17px;font-weight:600;margin:2px 2px 10px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .asx-banner{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 16px 38px rgba(18,60,80,.24)}
  .asx-banner img{display:block;width:100%;height:170px;object-fit:cover;animation:breathe 5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
  .asx-banner .cap{position:absolute;left:14px;bottom:12px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 2px 8px rgba(10,40,55,.6)}
  .asx-personas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .asx-p{position:relative;padding:10px;text-align:center;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .asx-p:active{transform:scale(.96)}
  .asx-p .ph{position:relative;border-radius:16px;overflow:hidden;margin-bottom:6px}
  .asx-p .ph img{display:block;width:100%;height:120px;object-fit:cover}
  .asx-p .ph img.girl{object-position:25% 30%}
  .asx-p .ph img.boy{object-position:78% 30%}
  .asx-p .nm{font-size:12.5px;font-weight:600}
  .asx-p .sb{font-size:10px;color:#4a6b78}
  .asx-p .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;display:none;place-items:center;background:linear-gradient(140deg,#5ad0b4,#2ba98c);box-shadow:0 4px 10px rgba(43,169,140,.45)}
  .asx-p.on{box-shadow:0 0 0 2.5px #2ba98c, 0 14px 34px rgba(18,60,80,.2)}
  .asx-p.on .tick{display:grid}
  .asx-voices{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .asx-v{padding:8px 14px;border-radius:999px;font-size:11.5px;font-weight:600;color:#33525f;cursor:pointer;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.75);display:flex;gap:6px;align-items:center}
  .asx-v svg{opacity:.7}
  .asx-v.on{background:linear-gradient(140deg,#8fe0cb,#3fb899);color:#063a2e;border-color:transparent;box-shadow:0 8px 18px rgba(63,184,153,.4)}
  .asx-card{padding:14px 16px;margin-bottom:14px}
  .asx-row{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600}
  .asx-row .sp{flex:1}
  .asx-slider{position:relative;height:6px;border-radius:3px;background:rgba(18,60,80,.15);margin:12px 2px 4px;cursor:pointer}
  .asx-slider .fill{position:absolute;left:0;top:0;bottom:0;width:60%;border-radius:3px;background:linear-gradient(90deg,#5ad0b4,#2ba98c)}
  .asx-slider .knob{position:absolute;left:60%;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:0 3px 8px rgba(18,60,80,.3)}
  .asx-sw{width:42px;height:25px;border-radius:999px;background:rgba(18,60,80,.18);position:relative;cursor:pointer;transition:background .2s}
  .asx-sw::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(18,60,80,.3);transition:left .2s cubic-bezier(.34,1.56,.64,1)}
  .asx-sw.on{background:linear-gradient(140deg,#5ad0b4,#2ba98c)}
  .asx-sw.on::after{left:20px}
  .asx-preview{margin-top:12px;width:100%;padding:11px;border-radius:14px;border:0;font-size:12.5px;font-weight:600;color:#063a2e;background:linear-gradient(140deg,#8fe0cb,#3fb899);cursor:pointer;box-shadow:0 10px 22px rgba(63,184,153,.4), inset 0 1px 0 rgba(255,255,255,.6)}
  .asx-tabs{position:absolute;left:14px;right:14px;bottom:24px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .asx-tabs span{font-size:12px;color:#4a6b78;cursor:pointer;padding:6px 13px;border-radius:999px}
  .asx-tabs span.on{background:linear-gradient(140deg,#ffd9c2,#ff9d68);color:#8a3a12;font-weight:600;box-shadow:0 6px 14px rgba(255,157,104,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.asx .L-far,.asx-banner img,.asx .L-mid .orb{animation:none}}
</style>
<div data-dc="as/root" class="asx">
  <div class="L L-far" data-fx-parallax="0.4" style="background:url(assets/as-bg-day.png) center/cover no-repeat"></div>
  <div class="L L-mid" data-fx-parallax="0.9"><span class="orb o1"></span><span class="orb o2"></span></div>
  <canvas data-fx="particles" data-fx-kind="petals" data-fx-n="14" data-fx-colors="#ffffff,#ffd6e2,#ffe9a8"></canvas>
  <div class="scroll">
    <div class="asx-h">形象与音色</div>
    <div class="asx-banner" data-fx-parallax="1.2"><img src="assets/as-persona.png" alt=""><span class="cap">双形象 · 昼夜同框</span></div>
    <div class="asx-personas" data-dc="as/personas">
      <div class="asx-p glass on" data-act="radio" data-group="persona"><span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round"><path d="m5 13 4 4 10-10"/></svg></span><div class="ph"><img class="girl" src="assets/as-persona.png" alt=""></div><div class="nm">小昼 · 昼</div><div class="sb">海风短发</div></div>
      <div class="asx-p glass" data-act="radio" data-group="persona"><span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round"><path d="m5 13 4 4 10-10"/></svg></span><div class="ph"><img class="boy" src="assets/as-persona.png" alt=""></div><div class="nm">小夜 · 夜</div><div class="sb">星野低沉</div></div>
    </div>
    <div class="asx-h">音色</div>
    <div class="asx-voices" data-dc="as/voices">
      <span class="asx-v on" data-act="radio" data-group="voice"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>温柔</span>
      <span class="asx-v" data-act="radio" data-group="voice"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>知性</span>
      <span class="asx-v" data-act="radio" data-group="voice"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>活泼</span>
      <span class="asx-v" data-act="radio" data-group="voice"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>低沉</span>
    </div>
    <div class="asx-card glass">
      <div class="asx-row">语速<span class="sp"></span><b data-dc="as/speedval">1.0×</b></div>
      <div class="asx-slider" data-dc="as/speed" data-act="slider" data-target="[data-dc='as/speedval']"><span class="fill"></span><span class="knob"></span></div>
      <div class="asx-row" style="margin-top:12px">降噪增强<span class="sp"></span><span class="asx-sw on" data-act="toggle"></span></div>
      <button class="asx-preview" data-act="toast" data-msg="用当前音色朗读：你好，我是小昼（演示）">预览音色</button>
    </div>
  </div>
  <div class="asx-tabs glass" data-dc="as/tabs">
    <span data-goto="01-home">首页</span><span data-goto="02-chat">聊天</span><span data-goto="03-call">通话</span><span class="on" data-goto="04-persona">形象</span><span data-goto="05-me">我的</span>
  </div>
</div>
