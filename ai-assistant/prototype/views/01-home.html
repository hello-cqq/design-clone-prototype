<style>
  .asx{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#12333f;background:#bfe3ef}
  .asx .L{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .asx .L-far{width:100%;height:100%;animation:kb 34s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .asx .L-mid .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.75;animation:bob 6s ease-in-out infinite}
  .asx .L-mid .o1{left:8%;top:12%;width:120px;height:120px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(140,230,220,.25) 70%)}
  .asx .L-mid .o2{right:10%;top:30%;width:80px;height:80px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(255,214,107,.28) 70%);animation-delay:-2.4s}
  .asx .L-mid .o3{left:20%;bottom:22%;width:60px;height:60px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.85),rgba(142,205,240,.3) 70%);animation-delay:-4s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .asx .scroll{position:relative;z-index:4;padding:52px 16px 110px;box-sizing:border-box}
  .glass{background:rgba(255,255,255,.58);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 14px 34px rgba(18,60,80,.16), inset 0 1px 0 rgba(255,255,255,.85)}
  .asx-hero{position:relative;padding:14px;margin-bottom:14px;overflow:hidden}
  .asx-hero .pic{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(18,60,80,.22)}
  .asx-hero .pic img{display:block;width:100%;height:250px;object-fit:cover;object-position:50% 32%;animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  .asx-hero .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(18,51,63,.35));pointer-events:none}
  .asx-hero .nm{position:absolute;left:22px;bottom:52px;color:#fff;font-size:22px;font-weight:600;text-shadow:0 2px 10px rgba(10,40,55,.55)}
  .asx-hero .st{position:absolute;right:16px;bottom:54px;background:rgba(126,220,195,.9);color:#0c4a3c;font-size:11px;font-weight:600;border-radius:999px;padding:5px 12px;box-shadow:0 4px 12px rgba(12,74,60,.3)}
  .asx-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .asx-act{padding:13px 10px;text-align:center;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .asx-act:active{transform:scale(.96)}
  .asx-act .ic{width:40px;height:40px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.6));box-shadow:0 6px 14px rgba(18,60,80,.16), inset 0 1px 0 #fff}
  .asx-act .lb{font-size:12.5px;font-weight:600}
  .asx-act .sb{font-size:10px;color:#4a6b78;margin-top:2px}
  .asx-sum{padding:14px 16px;margin-bottom:14px}
  .asx-sum .t{font-size:14px;font-weight:600;margin-bottom:8px}
  .asx-sum li{list-style:none;font-size:12px;color:#33525f;line-height:1.95;display:flex;gap:8px;align-items:baseline}
  .asx-sum li b{font-variant-numeric:tabular-nums;color:#12333f}
  .asx-sum li i{font-style:normal;width:6px;height:6px;border-radius:50%;flex:none;transform:translateY(-1px);box-shadow:0 0 8px currentColor}
  .asx-input{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px}
  .asx-input .ph{flex:1;font-size:12px;color:#5c7a86}
  .asx-input .send{width:38px;height:38px;border-radius:14px;background:linear-gradient(140deg,#8fe0cb,#3fb899);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px rgba(63,184,153,.42), inset 0 2px 0 rgba(255,255,255,.6)}
  .asx-tabs{position:absolute;left:14px;right:14px;bottom:24px;z-index:8;display:flex;justify-content:space-around;padding:9px 6px}
  .asx-tabs span{font-size:12px;color:#4a6b78;cursor:pointer;padding:6px 13px;border-radius:999px}
  .asx-tabs span.on{background:linear-gradient(140deg,#ffd9c2,#ff9d68);color:#8a3a12;font-weight:600;box-shadow:0 6px 14px rgba(255,157,104,.4), inset 0 1px 0 rgba(255,255,255,.7)}
  @media (prefers-reduced-motion: reduce){.asx .L-far,.asx-hero .pic img,.asx .L-mid .orb{animation:none}}
</style>
<div data-dc="as/root" class="asx">
  <div class="L L-far" data-fx-parallax="0.4" style="background:url(assets/as-bg-day.png) center/cover no-repeat"></div>
  <div class="L L-mid" data-fx-parallax="0.9"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
  <canvas data-fx="particles" data-fx-kind="motes" data-fx-n="20" data-fx-colors="#ffffff,#a5ecdc,#ffd66b"></canvas>
  <div class="scroll">
    <div class="asx-hero glass" data-dc="as/hero" data-fx-parallax="1.2">
      <div class="pic"><img src="assets/as-home.png" alt="" data-act="toast" data-msg="小昼：你好，今天想聊点什么？（演示）"></div>
      <div class="nm">小昼</div><span class="st">在线 · 语音就绪</span>
    </div>
    <div class="asx-acts" data-dc="as/acts">
      <div class="asx-act glass" data-goto="02-chat"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#1fa083;stroke-width:2.2;stroke-linecap:round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg></span><div class="lb">聊天</div><div class="sb">12 条未读</div></div>
      <div class="asx-act glass" data-act="toast" data-msg="语音对话：请说出你的问题（演示）"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#7a52c7;stroke-width:2.2;stroke-linecap:round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><div class="lb">语音对话</div><div class="sb">温柔音色</div></div>
      <div class="asx-act glass" data-goto="03-call"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#2b83c9;stroke-width:2.2;stroke-linecap:round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg></span><div class="lb">视频通话</div><div class="sb">高清就绪</div></div>
      <div class="asx-act glass" data-act="toast" data-msg="今日 3 条提醒已按优先级排好（演示）"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#d96f32;stroke-width:2.2;stroke-linecap:round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span><div class="lb">日程提醒</div><div class="sb">3 条待办</div></div>
    </div>
    <div class="asx-sum glass" data-dc="as/sum">
      <div class="t">今日摘要</div>
      <ul>
        <li><i style="background:#2fbf9f;color:#2fbf9f"></i>日程：<b>14:00</b> 产品评审 · 已备会议纪要模板</li>
        <li><i style="background:#4aa3e8;color:#4aa3e8"></i>天气：<b>26°</b> 晴 · 适宜外出拍摄</li>
        <li><i style="background:#ff8f5a;color:#ff8f5a"></i>待办：<b>2</b> 项高优 · 设计稿走查、图标选型</li>
      </ul>
    </div>
    <div class="asx-input glass" data-act="toast" data-msg="输入框：说出想法即可（演示）"><span class="ph">问问小昼…</span><span class="send" data-act="toast" data-msg="小昼：收到！（演示）"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round"><path d="m4 12 16-8-6 16-2-6z"/></svg></span></div>
  </div>
  <div class="asx-tabs glass" data-dc="as/tabs">
    <span class="on" data-goto="01-home">首页</span><span data-goto="02-chat">聊天</span><span data-goto="03-call">通话</span><span data-goto="04-persona">形象</span><span data-goto="05-me">我的</span>
  </div>
</div>
