<style>
  .xh{position:relative;min-height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#17364f;background:linear-gradient(180deg,#eaf4ff,#f6fbff)}
  .xh.night{color:#eaf4ff;background:linear-gradient(180deg,#0e2a4a,#123c66)}
  .xh .far{position:absolute;inset:0;background:url(assets/xh-bg-day.png) center/cover;opacity:.35;animation:kb 36s ease-in-out infinite alternate}
  .xh.night .far{background-image:url(assets/xh-bg-night.png);opacity:.4}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.04)}}
  .xh .scroll{position:relative;z-index:4;padding:52px 16px 112px;box-sizing:border-box}
  .xh .top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .xh .top .back{width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
  .xh .top h1{font-size:19px;font-weight:600;margin:0;flex:1}
  .xh .top .ic{width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
  .xh .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .xh .pc{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);box-shadow:0 16px 38px rgba(23,54,79,.16);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .xh.night .pc{background:rgba(14,42,74,.5);border-color:rgba(143,208,255,.3)}
  .xh .pc:active{transform:scale(.97)}
  .xh .pc img{display:block;width:100%;height:250px;object-fit:cover;object-position:50% 24%}
  .xh .pc .meta{padding:12px 14px 14px}
  .xh .pc .nm{font-size:17px;font-weight:600}
  .xh .pc .sb{font-size:10.5px;opacity:.62;margin-top:4px}
  .xh .pc .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;background:linear-gradient(140deg,#6db5f0,#3f86d6);box-shadow:0 6px 14px rgba(63,134,214,.45)}
  .xh .pc.on{box-shadow:0 0 0 2.5px #3f86d6, 0 16px 38px rgba(23,54,79,.2)}
  .xh .pc.on .tick{display:grid}
  .xh .nav{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .xh .nav span{background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-radius:18px;padding:10px 4px 9px;display:grid;place-items:center;gap:4px;font-size:11px;color:#3f6c8f;cursor:pointer;box-shadow:0 10px 24px rgba(23,54,79,.14)}
  .xh.night .nav span{background:rgba(14,42,74,.6);color:#bcd8f2}
  .xh .nav span.on{color:#2b76c8;font-weight:600}
  .xh.night .nav span.on{color:#8fd0ff}
  @media (prefers-reduced-motion: reduce){.xh .far{animation:none}}
</style>
<div data-dc="as/root" class="xh night">
  <div class="far" data-fx-parallax="0.4"></div>
  <canvas data-fx="particles" data-fx-kind="sparkles" data-fx-n="18" data-fx-colors="#ffffff,#8fd0ff"></canvas>
  <div class="scroll">
    <div class="top"><span class="back" data-goto="00-launch"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"><path d="m14 6-6 6 6 6"/></svg></span><h1>星海对话</h1><span class="ic" data-act="toast" data-msg="搜索：找找话题或角色（演示）"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></span></div>
    <div class="cards" data-dc="as/personas">
      <div class="pc on" data-act="radio" data-group="persona" data-char="xinghai"><span class="tick"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round"><path d="m5 13 4 4 10-10"/></svg></span><img src="assets/xh-xinghai.png" alt=""><div class="meta"><div class="nm">星海</div><div class="sb">当前角色 ｜ 切换音色</div></div></div>
      <div class="pc" data-act="radio" data-group="persona" data-char="haixi"><span class="tick"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round"><path d="m5 13 4 4 10-10"/></svg></span><img src="assets/xh-haixi.png" alt=""><div class="meta"><div class="nm">海汐</div><div class="sb">当前角色 ｜ 切换音色</div></div></div>
    </div>
  </div>
  <div class="nav" data-dc="as/tabs"><span class="on" data-dc="as/tab-home" data-goto="01-home"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><path d="m4 11 8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>首页</span><span data-dc="as/tab-chat" data-goto="02-chat"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><rect x="4" y="4" width="16" height="13" rx="3"/><path d="M9 21l3-4 3 4"/></svg>对话</span><span data-dc="as/tab-call" data-goto="03-call"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>视频</span><span data-dc="as/voice-entry" data-goto="04-settings"><svg width="17" height="17" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>设置</span></div>
</div>
