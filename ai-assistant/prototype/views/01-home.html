<style>
  .xh{--color-bg:#0e2a4a;position:absolute;inset:0;overflow:hidden;font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#eaf4ff;background:linear-gradient(180deg,#0e2a4a,#123c66)}
  .xh .far{position:absolute;inset:0;overflow:hidden}
  .xh .far::before{content:"";position:absolute;inset:-7%;background:url(assets/xh-bg-night.png) center/cover no-repeat;opacity:.5;animation:kb 36s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.08)}to{transform:scale(1.02)}}
  .xh .scroll{position:relative;z-index:4;height:100%;padding:52px 16px 112px;box-sizing:border-box;display:flex;flex-direction:column}
  .xh .top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .xh .top .back{width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
  .xh .top h1{font-size:19px;font-weight:600;margin:0;flex:1}
  .xh .top .ic{width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
  .xh .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .xh .pc{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;background:rgba(14,42,74,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(143,208,255,.3);box-shadow:0 16px 38px rgba(6,20,38,.35);transition:transform .2s cubic-bezier(.34,1.56,.64,1);padding:14px 14px 13px}
  .xh .pc:active{transform:scale(.97)}
  .xh .pc .orb{width:44px;height:44px;border-radius:50%;margin-bottom:10px;box-shadow:0 8px 18px rgba(6,20,38,.4), inset 0 2px 6px rgba(255,255,255,.35)}
  .xh .pc[data-char="xinghai"] .orb{background:radial-gradient(60% 60% at 35% 30%, #8fd0ff, #274b78 70%, #14979c88 100%), linear-gradient(140deg,#274b78,#8fd0ff)}
  .xh .pc[data-char="haixi"] .orb{background:radial-gradient(60% 60% at 35% 30%, #ffd166, #7a4a2b 70%, #ff8fb355 100%), linear-gradient(140deg,#7a4a2b,#ffd166)}
  .xh .pc .nm{font-size:17px;font-weight:600}
  .xh .pc .sb{font-size:10.5px;opacity:.62;margin-top:4px}
  .xh .pc .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;background:linear-gradient(140deg,#6db5f0,#3f86d6);box-shadow:0 6px 14px rgba(63,134,214,.45)}
  .xh .pc.on{box-shadow:0 0 0 2.5px #8fd0ff, 0 16px 38px rgba(6,20,38,.45)}
  .xh .pc.on .tick{display:grid}
  .xh .hint{margin-top:12px;font-size:10.5px;opacity:.55;text-align:center}
  .xh .nav{position:absolute;left:14px;right:14px;bottom:22px;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .xh .nav span{background:rgba(14,42,74,.6);backdrop-filter:blur(10px);border-radius:18px;padding:10px 4px 9px;display:grid;place-items:center;gap:4px;font-size:11px;color:#bcd8f2;cursor:pointer;box-shadow:0 10px 24px rgba(6,20,38,.35)}
  .xh .nav span.on{color:#8fd0ff;font-weight:600}
  @media (prefers-reduced-motion: reduce){.xh .far::before{animation:none}}

  .xh .vh{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;width:min(330px,80%);z-index:3;display:flex;justify-content:center;align-items:flex-end;gap:6px}
  .xh .vh img{width:132px;max-height:252px;object-fit:contain;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 14px 26px rgba(6,20,38,.5));animation:vhb 4.6s ease-in-out infinite;transform-origin:50% 96%}
  .xh .vh img + img{width:96px;max-height:252px;animation:vhb2 5.2s ease-in-out .6s infinite}
  @keyframes vhb{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-7px) rotate(.6deg)}}
  @keyframes vhb2{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.012)}}
  @media (prefers-reduced-motion: reduce){.xh .vh img{animation:none}}
</style>
