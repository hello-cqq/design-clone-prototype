<style>
  .as-root{font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#eef4fb;background:

  @keyframes pulse{0%{transform:scale(.92);opacity:.8}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  .as-wave i{display:block;width:4px;border-radius:2px;background:linear-gradient(180deg,#8fe0cb,#5cc9ab);animation:wv 1.1s ease-in-out infinite}
  .as-wave i:nth-child(2){animation-delay:.1s}.as-wave i:nth-child(3){animation-delay:.2s}.as-wave i:nth-child(4){animation-delay:.3s}
  .as-wave i:nth-child(5){animation-delay:.4s}.as-wave i:nth-child(6){animation-delay:.5s}.as-wave i:nth-child(7){animation-delay:.6s}
  .as-wave i:nth-child(8){animation-delay:.7s}.as-wave i:nth-child(9){animation-delay:.8s}.as-wave i:nth-child(10){animation-delay:.9s}
  .as-wave i:nth-child(11){animation-delay:1s}.as-wave i:nth-child(12){animation-delay:1.1s}
  @keyframes wv{0%,100%{height:8px}50%{height:30px}}
  .as-wave.on i{animation:none;height:6px;opacity:.5}
  .as-ctrls{position:absolute;left:0;right:0;bottom:96px;display:flex;justify-content:center;gap:14px}
  .as-ctrl{width:52px;height:52px;border-radius:50%;background:rgba(255,253,248,.14);backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 8px 18px rgba(0,0,0,.35);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .as-ctrl:active{transform:scale(.92)}
  .as-ctrl.on{background:rgba(126,220,195,.3)}
  .as-ctrl.hang{background:linear-gradient(140deg,#ff9d8a,#e0705e);width:60px;height:60px}
  .as-self{position:absolute;right:16px;top:64px;width:86px;height:118px;border-radius:18px;background:rgba(255,246,233,.16);border:1px solid rgba(255,246,233,.35);display:grid;place-items:center;box-shadow:0 10px 22px rgba(0,0,0,.4)}
  .as-tabs{position:absolute;left:14px;right:14px;bottom:26px;background:rgba(255,253,248,.12);backdrop-filter:blur(8px);border-radius:999px;display:flex;justify-content:space-around;padding:10px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);z-index:8}
  .as-tabs span{font-size:12px;color:#b9cfdd;cursor:pointer;padding:6px 12px;border-radius:999px}
  .as-tabs span.on{background:rgba(255,217,194,.25);color:#ffd9c2;font-weight:600}
  @media (prefers-reduced-motion: reduce){.as-big img,.as-big::before,.as-big::after,.as-wave i{animation:none}}
